<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWR Primary Loop — Animated Diagram</title>
<style>
  :root{
    --bg:#070a0f; --panel:#0a0e15; --border:#243040;
    --pipe-case:#2a3744;
    --warm:#c98a5a; --cool:#6a9dc0;
    --text:#bcccd8; --dim:#62768a; --vdim:#3a4e60;
    --tap:#507893; --leader:#36485a; --water:#1e455c;
    --rod:#4aa0c8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);padding:12px;}
  .frame{max-width:1180px;margin:0 auto;}
  .titlebar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .title{font-size:13px;font-weight:600;color:#8ab0c2;letter-spacing:.02em;}
  .title span{color:var(--warm);}
  .subtitle{font-size:10px;color:var(--vdim);font-style:italic;}

  .diagram-wrap{background:radial-gradient(ellipse at 42% 45%, #0c1019 0%, #070a0f 82%);
    border:0.5px solid var(--border);border-radius:10px;padding:6px;}
  svg.loop{width:100%;height:auto;display:block;}

  .pipe-case{fill:none;stroke:var(--pipe-case);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;}
  .pipe-case.thin{stroke-width:7;}
  .flow{fill:none;stroke-width:4;stroke-linecap:butt;stroke-dasharray:5 11;
        animation:flow var(--flow-dur,1.1s) linear infinite;}
  @keyframes flow{ to{ stroke-dashoffset:-16; } }
  .loop.stopped .flow{ animation-play-state:paused; }
  /* tube flow runs downward */
  .tube-flow{fill:none;stroke-width:3;stroke-linecap:butt;stroke-dasharray:4 8;
        animation:flow var(--flow-dur,1.1s) linear infinite;}
  .loop.stopped .tube-flow{ animation-play-state:paused; }

  .vessel{fill:#10171f;stroke:#3a5870;stroke-width:1.2;}
  .vessel-inner{fill:#0e141c;stroke:#28384a;stroke-width:.8;}
  .fuel{stroke:#34504e;stroke-width:1.4;}
  .comp-label{fill:var(--dim);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
  .comp-sub{fill:var(--vdim);font-size:7.5px;letter-spacing:.04em;}

  .water{fill:var(--water);opacity:.6;}
  .surface{fill:none;stroke:#4e88a4;stroke-width:1.4;opacity:.9;}
  .steam-space{fill:#121a22;}

  .valve{fill:#10171f;stroke:#4a6680;stroke-width:1;}
  .pump-body{fill:#10161f;stroke:#3a5870;stroke-width:1.2;}
  .pump-vane{stroke:#4a7088;stroke-width:1.4;stroke-linecap:round;}
  #pumpRotor{transform-origin:440px 405px;animation:spin var(--spin-dur,1.1s) linear infinite;}
  .loop.stopped #pumpRotor{animation-play-state:paused;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* rod position gauge */
  .rod-track{fill:#0c121a;stroke:#2c3e4e;stroke-width:1;}
  .rod-fill{fill:var(--rod);opacity:.85;}
  .rod-cap{fill:#5ab0d8;}

  .sec-arrow{fill:none;stroke:#46586a;stroke-width:1.4;}
  .sec-label{fill:var(--vdim);font-size:8px;letter-spacing:.04em;}

  .tap{fill:var(--tap);}
  .tap-tick{stroke:var(--tap);stroke-width:1.2;}
  .leader{stroke:var(--leader);stroke-width:.8;stroke-dasharray:2 2;fill:none;}
  .lbl-box{fill:#0e1620;stroke:#2c3e4e;stroke-width:.8;}
  .lbl-name{fill:var(--dim);font-size:8px;letter-spacing:.04em;text-transform:uppercase;}
  .lbl-val{fill:var(--text);font-size:13px;font-weight:600;}
  .lbl-val.derived{fill:#7aa4b8;}
  .lbl-unit{fill:var(--vdim);font-size:8px;}
  .lbl-note{fill:var(--vdim);font-size:7px;font-style:italic;}
  body.sensors-hidden .sensor{opacity:0;transition:opacity .25s;}
  .sensor{transition:opacity .25s;}
  .tmi .lbl-box{stroke:#3a5030;}
  .tmi .lbl-name{fill:#7a8a4a;}

  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:10px;
            background:var(--panel);border:0.5px solid var(--border);border-radius:8px;padding:10px 14px;}
  .ctrl{display:flex;flex-direction:column;gap:3px;min-width:118px;}
  .ctrl label{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;}
  .ctrl label b{color:#8ab0c2;font-weight:600;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:#22303c;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#5a8aa6;border:0.5px solid #7aaac6;cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#5a8aa6;cursor:pointer;border:none;}
  .btn{font-size:9px;padding:5px 11px;border-radius:4px;border:0.5px solid #34485a;background:#101a24;color:#6a8a9a;cursor:pointer;letter-spacing:.04em;}
  .btn:hover{border-color:#4a6a7a;color:#8aaaba;}
  .btn.trip{border-color:#6a2c1e;background:#1a0a06;color:#c0664a;}
  .toggle{font-size:9px;padding:5px 11px;border-radius:4px;border:0.5px solid #34485a;background:#101a24;color:#6a8a9a;cursor:pointer;}
  .toggle.on{border-color:#2a6a54;background:#0a1a12;color:#5aaa84;}
  .legend{display:flex;gap:14px;margin-left:auto;align-items:center;}
  .leg-item{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--dim);}
  .leg-dash{width:18px;height:3px;border-radius:2px;}
</style>
</head>
<body>
<div class="frame">

  <div class="titlebar">
    <div class="title">PWR Primary Loop <span>⚛</span> single-loop schematic</div>
    <div class="subtitle">flow animation · live levels · rod depth · sensors at read locations · physics illustrative</div>
  </div>

  <div class="diagram-wrap">
    <svg class="loop" id="loop" viewBox="0 105 1180 390" preserveAspectRatio="xMidYMid meet">

      <!-- ════════ PIPE CASINGS ════════ -->
      <!-- hot leg rail (high) RPV → SG -->
      <path class="pipe-case" d="M250,300 H670"/>
      <!-- surge line: PZR down to hot leg -->
      <path class="pipe-case thin" d="M430,300 V257"/>
      <!-- cold leg rail (low) SG → RCP → RPV -->
      <path class="pipe-case" d="M670,405 H250"/>
      <!-- short risers: hot leg into RPV top-side, cold leg into RPV bottom-side -->
      <path class="pipe-case" d="M250,300 H205"/>
      <path class="pipe-case" d="M250,405 H205"/>
      <!-- core internal up-flow -->
      <path class="pipe-case" d="M180,405 V315" stroke-width="7"/>

      <!-- ════════ FLOW ════════ -->
      <path class="flow" d="M180,405 V315" stroke="url(#gradCore)"/>
      <path class="flow" d="M205,300 H670" stroke="var(--warm)"/>
      <path class="flow" d="M430,300 V259" stroke="var(--warm)" style="animation-duration:3.4s;opacity:.5;"/>
      <path class="flow" d="M670,405 H205" stroke="var(--cool)"/>

      <defs>
        <linearGradient id="gradCore" x1="0" y1="405" x2="0" y2="315" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#6a9dc0"/><stop offset="1" stop-color="#c98a5a"/>
        </linearGradient>
        <linearGradient id="gradTube" x1="0" y1="300" x2="0" y2="405" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#c98a5a" class="tubeWarmStop"/>
          <stop offset="0.55" stop-color="#7a7a78"/>
          <stop offset="1" stop-color="#6a9dc0"/>
        </linearGradient>
        <clipPath id="pzrClip"><rect x="402" y="161" width="56" height="94" rx="8"/></clipPath>
        <clipPath id="sgClip"><rect x="672" y="172" width="116" height="261" rx="14"/></clipPath>
      </defs>

      <!-- ════════ REACTOR VESSEL ════════ -->
      <rect class="vessel" x="128" y="250" width="104" height="205" rx="24"/>
      <rect class="vessel-inner" x="150" y="305" width="60" height="130" rx="3"/>
      <line class="fuel" x1="160" y1="312" x2="160" y2="430"/>
      <line class="fuel" x1="170" y1="312" x2="170" y2="430"/>
      <line class="fuel" x1="180" y1="312" x2="180" y2="430"/>
      <line class="fuel" x1="190" y1="312" x2="190" y2="430"/>
      <line class="fuel" x1="200" y1="312" x2="200" y2="430"/>
      <text class="comp-label" x="180" y="282" text-anchor="middle">Reactor</text>
      <text class="comp-sub" x="180" y="293" text-anchor="middle">RPV / Core</text>
      <!-- excore neutron detector -->
      <rect x="112" y="360" width="9" height="40" rx="2" fill="#10171f" stroke="#3a5870" stroke-width=".8"/>

      <!-- ════════ CONTROL ROD POSITION GAUGE (out the top of the vessel) ════════ -->
      <rect class="rod-track" x="172" y="170" width="16" height="84" rx="3"/>
      <!-- drive shaft into core -->
      <rect id="rodFill" class="rod-fill" x="174" y="176" width="12" height="40" rx="2"/>
      <rect id="rodCap" class="rod-cap" x="172" y="170" width="16" height="6" rx="2"/>
      <text class="comp-sub" x="180" y="164" text-anchor="middle" style="fill:#5a7488;">rods</text>

      <!-- ════════ PRESSURIZER ════════ -->
      <rect class="vessel" x="400" y="159" width="60" height="98" rx="10"/>
      <g clip-path="url(#pzrClip)">
        <rect class="steam-space" x="402" y="161" width="56" height="94"/>
        <rect class="water" id="pzrWater" x="402" y="205" width="56" height="50"/>
        <path class="surface" id="pzrSurface" d="M402,205 H458"/>
      </g>
      <text class="comp-label" x="430" y="211" text-anchor="middle" style="fill:#5a7488;">PZR</text>
      <!-- PORV/spray at top -->
      <path class="pipe-case thin" d="M430,159 V137" stroke-width="5"/>
      <polygon class="valve" points="423,147 437,147 430,155"/>
      <polygon class="valve" points="423,141 437,141 430,135"/>
      <circle cx="430" cy="133" r="3" class="valve"/>

      <!-- ════════ STEAM GENERATOR (vertical-tube heat exchanger) ════════ -->
      <rect class="vessel" x="670" y="170" width="120" height="265" rx="16"/>
      <g clip-path="url(#sgClip)">
        <rect class="steam-space" x="672" y="172" width="116" height="261"/>
        <rect class="water" id="sgWater" x="672" y="250" width="116" height="183"/>
        <path class="surface" id="sgSurface" d="M672,250 H788"/>
      </g>
      <text class="comp-label" x="730" y="200" text-anchor="middle">Steam Gen</text>
      <text class="comp-sub" x="730" y="211" text-anchor="middle">U-tube · heat exchanger</text>
      <!-- vertical tube bundle: built by JS into #tubeBundle -->
      <g id="tubeBundle"></g>
      <!-- secondary steam out -->
      <path class="sec-arrow" d="M730,170 V140"/>
      <polygon points="726,146 734,146 730,138" fill="#46586a"/>
      <text class="sec-label" x="730" y="132" text-anchor="middle">steam → turbine</text>
      <!-- feedwater in -->
      <path class="sec-arrow" d="M824,360 H792"/>
      <polygon points="798,356 798,364 790,360" fill="#46586a"/>
      <text class="sec-label" x="828" y="363" text-anchor="start">feed</text>

      <!-- ════════ REACTOR COOLANT PUMP (on cold leg) ════════ -->
      <circle class="pump-body" cx="440" cy="405" r="18"/>
      <g id="pumpRotor">
        <line class="pump-vane" x1="440" y1="405" x2="440" y2="390"/>
        <line class="pump-vane" x1="440" y1="405" x2="453" y2="413"/>
        <line class="pump-vane" x1="440" y1="405" x2="427" y2="413"/>
      </g>
      <circle cx="440" cy="405" r="3" fill="#3a5870"/>
      <text class="comp-sub" x="440" y="436" text-anchor="middle" style="fill:#5a7488;">RCP</text>

      <!-- ════════ SENSORS ════════ -->
      <g class="sensors">

        <!-- Reactor Power (excore detector) → under Rod Position -->
        <g class="sensor">
          <circle class="tap" cx="116" cy="380" r="2.4"/>
          <path class="leader" d="M102,236 V380 H116"/>
          <rect class="lbl-box" x="56" y="206" width="92" height="30" rx="4"/>
          <text class="lbl-name" x="63" y="217">Reactor Power</text>
          <text class="lbl-val" x="63" y="231"><tspan id="vPower">100.1</tspan><tspan class="lbl-unit"> %</tspan></text>
        </g>

        <!-- Control Rod Position -->
        <g class="sensor">
          <rect class="lbl-box" x="56" y="150" width="92" height="42" rx="4"/>
          <text class="lbl-name" x="63" y="161">Rod Position</text>
          <text class="lbl-val" x="63" y="175"><tspan id="vRod">8</tspan><tspan class="lbl-unit"> % ins</tspan></text>
          <text class="lbl-note" x="63" y="186">withdrawn = power up</text>
        </g>

        <!-- Subcooling (core exit, computed) -->
        <g class="sensor">
          <circle class="tap" cx="232" cy="345" r="2.4"/>
          <path class="leader" d="M232,345 V378 H246"/>
          <rect class="lbl-box" x="246" y="364" width="112" height="30" rx="4"/>
          <text class="lbl-name" x="253" y="375">Subcooling</text>
          <text class="lbl-val derived" x="253" y="389"><tspan id="vSub">74</tspan><tspan class="lbl-unit"> °F</tspan></text>
          <text class="lbl-note" x="300" y="389">computed</text>
        </g>

        <!-- Core Inventory (vessel) — TMI point -->
        <g class="sensor tmi">
          <circle class="tap" cx="160" cy="345" r="2.4"/>
          <path class="leader" d="M160,345 H246 V332"/>
          <rect class="lbl-box" x="246" y="320" width="112" height="40" rx="4"/>
          <text class="lbl-name" x="253" y="331">Core Inventory</text>
          <text class="lbl-val" x="253" y="345"><tspan id="vInv">full</tspan></text>
          <text class="lbl-note" x="253" y="356">reads at vessel — not PZR</text>
        </g>

        <!-- Primary Pressure (PZR) -->
        <g class="sensor">
          <line class="tap-tick" x1="394" y1="195" x2="406" y2="195"/>
          <circle class="tap" cx="400" cy="195" r="2.4"/>
          <path class="leader" d="M400,195 V160 H366"/>
          <rect class="lbl-box" x="274" y="145" width="92" height="30" rx="4"/>
          <text class="lbl-name" x="281" y="156">Primary Press</text>
          <text class="lbl-val" x="281" y="170"><tspan id="vPress">2235</tspan><tspan class="lbl-unit"> psi</tspan></text>
        </g>

        <!-- PZR Level -->
        <g class="sensor">
          <line class="tap-tick" x1="394" y1="229" x2="406" y2="229"/>
          <circle class="tap" cx="400" cy="229" r="2.4"/>
          <path class="leader" d="M400,229 H352 V210"/>
          <rect class="lbl-box" x="274" y="195" width="78" height="30" rx="4"/>
          <text class="lbl-name" x="281" y="206">PZR Level</text>
          <text class="lbl-val" x="281" y="220"><tspan id="vPzr">55</tspan><tspan class="lbl-unit"> %</tspan></text>
        </g>

        <!-- PORV -->
        <g class="sensor">
          <circle class="tap" cx="430" cy="133" r="2.4"/>
          <path class="leader" d="M430,133 H486"/>
          <rect class="lbl-box" x="486" y="118" width="96" height="30" rx="4"/>
          <text class="lbl-name" x="493" y="129">PORV / Block</text>
          <text class="lbl-val" x="493" y="143"><tspan id="vPorv">closed</tspan></text>
        </g>

        <!-- T-hot (hot leg) -->
        <g class="sensor">
          <line class="tap-tick" x1="540" y1="294" x2="540" y2="306"/>
          <circle class="tap" cx="540" cy="300" r="2.4"/>
          <path class="leader" d="M540,300 V325 H516"/>
          <rect class="lbl-box" x="424" y="320" width="92" height="30" rx="4"/>
          <text class="lbl-name" x="431" y="331">T-hot · hot leg</text>
          <text class="lbl-val" x="431" y="345"><tspan id="vThot">609</tspan><tspan class="lbl-unit"> °F</tspan></text>
        </g>

        <!-- T-cold (cold leg) -->
        <g class="sensor">
          <line class="tap-tick" x1="540" y1="399" x2="540" y2="411"/>
          <circle class="tap" cx="540" cy="405" r="2.4"/>
          <path class="leader" d="M540,405 V443 H500"/>
          <rect class="lbl-box" x="500" y="428" width="96" height="30" rx="4"/>
          <text class="lbl-name" x="507" y="439">T-cold · cold leg</text>
          <text class="lbl-val" x="507" y="453"><tspan id="vTcold">549</tspan><tspan class="lbl-unit"> °F</tspan></text>
        </g>

        <!-- SG Level -->
        <g class="sensor">
          <line class="tap-tick" x1="664" y1="250" x2="676" y2="250"/>
          <circle class="tap" cx="670" cy="250" r="2.4"/>
          <path class="leader" d="M670,250 H626 V236"/>
          <rect class="lbl-box" x="572" y="236" width="78" height="30" rx="4"/>
          <text class="lbl-name" x="579" y="247">SG Level</text>
          <text class="lbl-val" x="579" y="261"><tspan id="vSg">65</tspan><tspan class="lbl-unit"> %</tspan></text>
        </g>

        <!-- RCP Flow -->
        <g class="sensor">
          <circle class="tap" cx="440" cy="423" r="2.4"/>
          <path class="leader" d="M440,423 V443 H392"/>
          <rect class="lbl-box" x="300" y="428" width="92" height="30" rx="4"/>
          <text class="lbl-name" x="307" y="439">RCP Flow</text>
          <text class="lbl-val" x="307" y="453"><tspan id="vFlow">100</tspan><tspan class="lbl-unit"> %</tspan></text>
        </g>

      </g>

    </svg>
  </div>

  <div class="controls">
    <div class="ctrl">
      <label>RCP Flow <b id="lblFlow">100%</b></label>
      <input type="range" id="flow" min="0" max="110" value="100">
    </div>
    <div class="ctrl">
      <label>Reactor Power <b id="lblPower">100%</b></label>
      <input type="range" id="power" min="0" max="100" value="100">
    </div>
    <div class="ctrl">
      <label>Rod Insertion <b id="lblRod">8%</b></label>
      <input type="range" id="rod" min="0" max="100" value="8">
    </div>
    <div class="ctrl">
      <label>PZR Level <b id="lblPzr">55%</b></label>
      <input type="range" id="pzr" min="15" max="85" value="55">
    </div>
    <button class="btn trip" id="trip">Trip RCP</button>
    <button class="btn" id="reset">Reset</button>
    <button class="toggle on" id="sensorsToggle">Sensors</button>

    <div class="legend">
      <div class="leg-item"><div class="leg-dash" style="background:var(--warm)"></div>hot coolant</div>
      <div class="leg-item"><div class="leg-dash" style="background:var(--cool)"></div>cooled coolant</div>
    </div>
  </div>

</div>

<script>
(function(){
  const loop=document.getElementById('loop');
  const $=id=>document.getElementById(id);

  // ── vertical heat-exchanger tube bundle: hot in at top, cool out at bottom ──
  (function buildBundle(){
    const ns='http://www.w3.org/2000/svg';
    const bundle=$('tubeBundle');
    const top=300, bot=405;             // hot leg height → cold leg height
    const xL=690, xR=752;               // bundle span, clear of both SG edges
    const xs=[];
    for(let x=xL;x<=xR;x+=10.3) xs.push(Math.round(x));

    // tube casings (vertical only — no horizontal header rail)
    xs.forEach(x=>{
      const tc=document.createElementNS(ns,'path');
      tc.setAttribute('fill','none'); tc.setAttribute('stroke','#243140');
      tc.setAttribute('stroke-width','3.2'); tc.setAttribute('stroke-linecap','round');
      tc.setAttribute('d',`M${x},${top} V${bot}`);
      bundle.appendChild(tc);
    });
    // dark connecting elbows: hot leg (ends 670,300) → first tube; tubes → cold leg (670,450)
    // inlet header: spans tube tops, fed by hot leg (warm). Dimmed so it reads as internal manifold.
    const inHdr=document.createElementNS(ns,'path');
    inHdr.setAttribute('fill','none'); inHdr.setAttribute('stroke','#2a3744');
    inHdr.setAttribute('stroke-width','4'); inHdr.setAttribute('stroke-linecap','round');
    inHdr.setAttribute('d',`M670,300 H${xR}`);
    bundle.appendChild(inHdr);
    const inFlow=document.createElementNS(ns,'path');
    inFlow.setAttribute('class','flow'); inFlow.setAttribute('d',`M670,300 H${xR}`);
    inFlow.setAttribute('stroke','var(--warm)'); inFlow.setAttribute('opacity','0.45');
    bundle.appendChild(inFlow);
    // outlet header: spans tube bottoms, drains to cold leg (cool)
    const outHdr=document.createElementNS(ns,'path');
    outHdr.setAttribute('fill','none'); outHdr.setAttribute('stroke','#2a3744');
    outHdr.setAttribute('stroke-width','4'); outHdr.setAttribute('stroke-linecap','round');
    outHdr.setAttribute('d',`M670,${bot} H${xR}`);
    bundle.appendChild(outHdr);
    const outFlow=document.createElementNS(ns,'path');
    outFlow.setAttribute('class','flow'); outFlow.setAttribute('d',`M${xR},${bot} H670`);
    outFlow.setAttribute('stroke','var(--cool)'); outFlow.setAttribute('opacity','0.45');
    bundle.appendChild(outFlow);

    // tube flow (warm→cool down each tube)
    xs.forEach(x=>{
      const f=document.createElementNS(ns,'path');
      f.setAttribute('class','tube-flow'); f.setAttribute('d',`M${x},${top} V${bot}`);
      f.setAttribute('stroke','url(#gradTube)'); f.setAttribute('stroke-dasharray','4 8');
      bundle.appendChild(f);
    });
  })();


  let flow=1, power=1, pzrLevel=0.55, rodIns=0.08, tripped=false, phase=0;

  const flowEl=$('flow'),powerEl=$('power'),pzrEl=$('pzr'),rodEl=$('rod');
  flowEl.addEventListener('input',()=>{tripped=false;flow=flowEl.value/100;});
  powerEl.addEventListener('input',()=>{power=powerEl.value/100;});
  pzrEl.addEventListener('input',()=>{pzrLevel=pzrEl.value/100;});
  rodEl.addEventListener('input',()=>{rodIns=rodEl.value/100;});
  $('trip').addEventListener('click',()=>tripped=true);
  $('reset').addEventListener('click',()=>{
    tripped=false;flow=1;power=1;pzrLevel=0.55;rodIns=0.08;
    flowEl.value=100;powerEl.value=100;pzrEl.value=55;rodEl.value=8;
  });
  $('sensorsToggle').addEventListener('click',e=>{
    document.body.classList.toggle('sensors-hidden',!e.target.classList.toggle('on'));
  });

  function tsat(psi){ return 560+(psi-1000)*0.066; }

  let last=performance.now();
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000);last=now;phase+=dt;
    if(tripped&&flow>0.02){flow*=Math.pow(0.45,dt);if(flow<0.02)flow=0;flowEl.value=Math.round(flow*100);}

    if(flow<0.04){loop.classList.add('stopped');}
    else{loop.classList.remove('stopped');
      loop.style.setProperty('--flow-dur',Math.max(0.35,Math.min(7,1.05/flow)).toFixed(3)+'s');
      loop.style.setProperty('--spin-dur',Math.max(0.25,Math.min(4,0.7/flow)).toFixed(3)+'s');}

    const Tcold=549+Math.sin(phase*0.7)*0.4;
    const effFlow=Math.max(0.12,flow);
    const Thot=Tcold+Math.min(160,60*(power/effFlow));
    const Tavg=(Thot+Tcold)/2;
    let press=2235+(Thot-609)*1.1+Math.sin(phase*1.3)*1.5;
    const subcool=(tsat(press)+113)-Thot;

    $('vPower').textContent=(power*100+Math.sin(phase*2.1)*0.08).toFixed(1);
    $('vThot').textContent=Math.round(Thot);
    $('vTcold').textContent=Math.round(Tcold);
    $('vPress').textContent=Math.round(press);
    $('vSub').textContent=Math.max(0,Math.round(subcool));
    $('vFlow').textContent=Math.round(flow*100);
    $('vPzr').textContent=Math.round(pzrLevel*100);
    $('vSg').textContent=65;
    $('vPorv').textContent='closed';
    $('vRod').textContent=Math.round(rodIns*100);
    $('vInv').textContent=flow<0.04?'static':'full';

    $('lblFlow').textContent=Math.round(flow*100)+'%';
    $('lblPower').textContent=Math.round(power*100)+'%';
    $('lblPzr').textContent=Math.round(pzrLevel*100)+'%';
    $('lblRod').textContent=Math.round(rodIns*100)+'%';

    // warm tint
    const warmAmt=Math.min(1,Math.max(0,(Thot-549)/160));
    const warmCol=`rgb(${Math.round(180+warmAmt*55)},${Math.round(135-warmAmt*35)},${Math.round(88-warmAmt*18)})`;
    document.documentElement.style.setProperty('--warm',warmCol);
    document.querySelectorAll('.tubeWarmStop').forEach(s=>s.setAttribute('stop-color',warmCol));

    // rod gauge: track raised with vessel. insertion drives the fill DOWN into core.
    const rTop=176, rH=72;
    const fillH=12+rodIns*rH;       // more insertion → longer shaft down
    $('rodFill').setAttribute('height',fillH.toFixed(1));
    $('rodCap').setAttribute('y',(rTop-6+ (rodIns*0)).toFixed(1)); // cap stays at top of drive

    // PZR level
    const pT=161,pB=255,pH=pB-pT, wy=pB-pzrLevel*pH, bob=Math.sin(phase*2.2)*1.1;
    $('pzrWater').setAttribute('y',(wy+bob).toFixed(1));
    $('pzrWater').setAttribute('height',(pB-(wy+bob)).toFixed(1));
    $('pzrSurface').setAttribute('d',`M402,${(wy+bob).toFixed(1)} q14,-2 28,0 t28,0`);

    // SG secondary level
    const sT=172,sB=433,sH=sB-sT, sy=sB-0.65*sH, sbob=Math.sin(phase*3)*1.1;
    $('sgWater').setAttribute('y',(sy+sbob).toFixed(1));
    $('sgWater').setAttribute('height',(sB-(sy+sbob)).toFixed(1));
    $('sgSurface').setAttribute('d',`M672,${(sy+sbob).toFixed(1)} q29,-2 58,0 t58,0`);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
