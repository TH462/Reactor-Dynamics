<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactor Dynamics</title>
    <!--
      Reactor Dynamics — educational browser-based nuclear power plant simulator.
      Browser-only, vanilla JS, no build step, no server, no WebAssembly, no framework.
      Scripts are loaded as ES modules / plain scripts in dependency order:
      engines (M1-M3) -> layers (M4-M7) -> ui (M8). Wiring is added as modules land.
    -->
</head>
<body>
    <!-- UI (M8) mounts here. -->
    <div id="app"></div>

    <!-- Physics engines (global-namespace scripts, dependency order). -->
    <!-- PWR (M1) — hosts Three Mile Island. -->
    <script src="engines/pwr/pwr_config.js"></script>
    <script src="engines/pwr/pwr_protection.js"></script>
    <script src="engines/pwr/pwr_thermal.js"></script>
    <script src="engines/pwr/pwr_pressurizer.js"></script>
    <script src="engines/pwr/pwr_primary.js"></script>
    <script src="engines/pwr/pwr_steam_generator.js"></script>
    <script src="engines/pwr/pwr_instruments.js"></script>
    <script src="engines/pwr/pwr_engine.js"></script>

    <!-- Control & Failure Layer (M4) — general machinery, consumes engine config. -->
    <script src="layers/control_failure_layer.js"></script>
    <!-- layers (M5–M7) and UI (M8) wiring added as those modules land. -->
</body>
</html>
