<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PWR Synoptic — acceptance checks (dev)</title>
  <link rel="stylesheet" href="../shell.css">
  <link rel="stylesheet" href="../diagram/pwr_synoptic.css">
  <style>
    body { overflow: auto; }
    #host { width: 900px; height: 420px; position: relative; border: 1px solid #333; }
    #out { font: 12px/1.5 Consolas, monospace; color: #d8dee9; white-space: pre; padding: 10px; }
    .p { color: #8ce0a6; } .f { color: #e08c8c; }
  </style>
</head>
<body>
  <div id="host"></div>
  <div id="out"></div>
  <script src="../../engines/load_mode.js"></script>
  <script src="../../engines/pwr/pwr_config.js"></script>
  <script src="../../layers/control/pwr_control.js"></script>
  <script src="../../engines/pwr/pwr_thermal.js"></script>
  <script src="../../engines/pwr/pwr_pressurizer.js"></script>
  <script src="../../engines/pwr/pwr_primary.js"></script>
  <script src="../../engines/pwr/pwr_steam_generator.js"></script>
  <script src="../../engines/pwr/pwr_instruments.js"></script>
  <script src="../../engines/pwr/pwr_engine.js"></script>
  <script src="../../layers/control/rbmk_control.js"></script>
  <script src="../../engines/rbmk/rbmk_config.js"></script>
  <script src="../../engines/rbmk/rbmk_kinetics.js"></script>
  <script src="../../engines/rbmk/rbmk_thermal.js"></script>
  <script src="../../engines/rbmk/rbmk_rods.js"></script>
  <script src="../../engines/rbmk/rbmk_instruments.js"></script>
  <script src="../../engines/rbmk/rbmk_engine.js"></script>
  <script src="../../engines/bwr/bwr_config.js"></script>
  <script src="../../layers/control/bwr_control.js"></script>
  <script src="../../engines/bwr/bwr_vessel.js"></script>
  <script src="../../engines/bwr/bwr_recirculation.js"></script>
  <script src="../../engines/bwr/bwr_safety_systems.js"></script>
  <script src="../../engines/bwr/bwr_instruments.js"></script>
  <script src="../../engines/bwr/bwr_engine.js"></script>
  <script src="../../layers/control/control_kernel.js"></script>
  <script src="../../layers/instructor_layer.js"></script>
  <script src="../../layers/simulation_service.js"></script>
  <script src="../diagram/pwr_synoptic.js"></script>
  <script>
  (function () {
    'use strict';
    var RD = globalThis.RD;
    var out = [], nPass = 0, nFail = 0;
    function ck(name, cond, detail) {
      if (cond) { nPass++; out.push('<span class="p">PASS</span> ' + name); }
      else { nFail++; out.push('<span class="f">FAIL</span> ' + name + (detail != null ? '  [' + detail + ']' : '')); }
    }
    function visible(el) {
      if (!el) return false;
      var cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden') return false;
      return el.offsetParent !== null || el instanceof SVGElement;
    }

    var mode = 'learning', overlay = false;
    var cmds = [];
    var ctx = {
      cmd: function (c) { cmds.push(c); },
      conv: function (v) { return v; }, unit: function (d) { return d === 'pressure' ? 'MPa' : '°C'; },
      dispP: function (v) { return v == null ? '—' : v.toFixed(2) + ' MPa'; },
      dispT: function (v) { return v == null ? '—' : v.toFixed(0) + ' °C'; },
      dispTd: function (v) { return v == null ? '—' : v.toFixed(0) + ' °C'; },
      dispV: function (v) { return v == null ? '—' : v.toFixed(1) + ' kPa'; },
      mode: function () { return mode; }, overlay: function () { return overlay; },
    };

    var svc = new RD.SimulationService({ seed: 0x77 });
    svc.selectPlant('pwr', 'hot_full_power');
    var base = svc.assembleSnapshot();

    RD.PwrSynoptic.mount(document.getElementById('host'), ctx);
    var stage = document.getElementById('pwStage');

    // ---- 1. structure: 12 margin cards + 2 embedded panels, manifest ids live
    ck('12 margin cards', stage.querySelectorAll('.plant-card').length === 12, stage.querySelectorAll('.plant-card').length);
    ck('2 embedded panels', stage.querySelectorAll('.diagram-panel').length === 2);
    var ids = ['pwLoop','pwRodFill','pwRodShutdown','pwCoreGlow','pwSubcoolBar','pwTapSubcool','pwHotLeg','pwColdLeg','pwTapThot','pwTapTcold',
      'pwPzrHeater','pwPzrSprayValve','pwPzrSprayMist','pwPzrWater','pwPzrSurface','pwPorv','pwPorvBlock','pwSafetyValve','pwReliefFlow',
      'pwCvcsBox','pwCvcsPanel','pwCvcsChargePump','pwCvcsChargeLeg','pwCvcsLetdownBranch','pwHpiLine','pwHpiFlow','pwAfwLine','pwAfwFlow',
      'pwRhrLoop','pwLpiLine','pwAccumulatorTanks','pwAccumulatorPanel','pwAccumulatorCheckValve','pwAccumulatorInjection',
      'pwRcpRotor','pwSgWater','pwSgSurface','pwSgUtubeRef','pwSgSteamHeader','pwSgSteamOutletAnchor','pwGovValve','pwSteamDump',
      'pwTurbineRotor','pwGenerator','pwShaft','pwCondenser','pwCondWater','pwCondPump','pwFeedPump','pwCoolingTower','pwCwFlow','pwTapPorv'];
    var missing = ids.filter(function (id) { return !document.getElementById(id); });
    ck('manifest element ids present', missing.length === 0, 'missing: ' + missing.join(','));
    var anchors = ['pwRpvAnchor','pwCoreAnchor','pwHotLegAnchor','pwColdLegAnchor','pwPzrAnchor','pwPorvAnchor','pwCvcsBoxAnchor',
      'pwCvcsLetdownBranchAnchor','pwCvcsChargePumpAnchor','pwRcpAnchor','pwSgAnchor','pwSgSteamOutletAnchor','pwGovValveAnchor',
      'pwTurbineAnchor','pwGeneratorAnchor','pwCondenserAnchor','pwHpiLineAnchor','pwAccumulatorsAnchor','pwAccumulatorInjectionAnchor','pwLpiLineAnchor'];
    var missA = anchors.filter(function (id) { return !document.getElementById(id); });
    ck('A.2b anchors present', missA.length === 0, 'missing: ' + missA.join(','));
    ck('leaders drawn for anchored cards', document.querySelectorAll('#pwCardLeaders .lead').length >= 11,
      document.querySelectorAll('#pwCardLeaders .lead').length);

    // ---- 2. steady full power, Learning
    RD.PwrSynoptic.render(base);
    ck('Learning: SUR row visible', visible(stage.querySelector('[data-f="sur"]')));
    ck('overlay off: rho row hidden', !visible(stage.querySelector('[data-f="rho"]')));
    ck('accumulators idle: no discharge dashes', !document.getElementById('pwAccumulatorFlow').classList.contains('on'));
    ck('accumulators idle: no flow UI', stage.querySelector('[data-f="accFlowRow"]').style.display === 'none');
    ck('loop dashes on (RCP running)', document.getElementById('pwHotLegFlow').classList.contains('on'));
    ck('turbine rotor spinning', document.getElementById('pwTurbineRotor').classList.contains('on'));
    ck('governor bow-tie open', !document.getElementById('pwGovValve').classList.contains('closed'));
    ck('relief not flowing', !document.getElementById('pwReliefFlow').classList.contains('on'));
    ck('xenon chip hidden at equilibrium', !document.getElementById('pwXenonChip'));
    ck('fuel chip hidden at nominal power', !document.getElementById('pwFuelStatus'));
    ck('PZR pressure section open by default', stage.querySelector('.csec[data-sec="press"]').classList.contains('open'));
    ck('PZR level section collapsed by default', !stage.querySelector('.csec[data-sec="level"]').classList.contains('open'));

    // ---- 3. Realistic hides every teaching layer
    mode = 'realistic';
    RD.PwrSynoptic.render(base);
    ck('Realistic: stage attr set', stage.getAttribute('data-mode') === 'realistic');
    ck('Realistic: SUR hidden', !visible(stage.querySelector('[data-f="sur"]')));
    ck('Realistic: PORV dual hidden', !visible(stage.querySelector('[data-f="porvDual"]')));
    ck('Realistic: cherenkov suppressed', getComputedStyle(document.getElementById('pwCoreGlow')).opacity === '0');

    // ---- 4. TMI spot-check (Realistic): stuck PORV + lying indicator
    var tmi = svc.assembleSnapshot();
    tmi.active_failures = [{ id: 'stuck_porv_open' }, { id: 'porv_indicator_stuck_closed' }];
    tmi.true_state.porv_open = true;
    tmi.instruments.porv_indicator = 'closed';
    tmi.instruments.subcooling_margin = 4.0;
    tmi.instruments.pzr_level = 88;
    RD.PwrSynoptic.render(tmi);
    ck('TMI Realistic: indicator reads closed', stage.querySelector('[data-f="porvInd"]').textContent === 'closed');
    ck('TMI Realistic: NO relief animation', !document.getElementById('pwReliefFlow').classList.contains('on'));
    ck('TMI Realistic: NO ghost animation', !document.getElementById('pwReliefGhost').classList.contains('on'));
    ck('TMI Realistic: PORV bow-tie shows closed', document.getElementById('pwPorv').classList.contains('closed'));
    ck('TMI: subcool numeric warns', /warn|alarm/.test(stage.querySelector('[data-f="subcool"]').className));
    ck('TMI: PZR level section auto-expanded', stage.querySelector('.csec[data-sec="level"]').classList.contains('open'));
    ck('TMI: level section shows 88 %', stage.querySelector('[data-f="pzrL"]').textContent.indexOf('88') === 0);
    ck('TMI: what-matters-now pulse on PZR card', stage.querySelector('[data-card="pzr"]').classList.contains('wm'));
    ck('TMI: what-matters-now pulse on Relief card', stage.querySelector('[data-card="relief"]').classList.contains('wm'));
    ck('TMI: subcool bar pulsing', document.getElementById('pwSubcoolBar').classList.contains('wm'));

    // ---- 5. TMI in Learning: deception dual + true-position relief animation
    mode = 'learning';
    RD.PwrSynoptic.render(tmi);
    ck('TMI Learning: dual shows actual OPEN', /OPEN/.test(stage.querySelector('[data-f="porvDual"]').textContent));
    ck('TMI Learning: ghost relief animates from porv_open', document.getElementById('pwReliefGhost').classList.contains('on'));

    // ---- 6. subcooling ghost only with overlay + failed P/T sensor
    overlay = true;
    var gsnap = svc.assembleSnapshot();
    gsnap.active_failures = [{ id: 'tavg_sensor_failure' }];
    RD.PwrSynoptic.render(gsnap);
    ck('ghost cursor with overlay + tavg failure', stage.querySelector('[data-f="scGhost"]').classList.contains('on'));
    overlay = false;
    RD.PwrSynoptic.render(gsnap);
    ck('no ghost cursor with overlay off', !stage.querySelector('[data-f="scGhost"]').classList.contains('on'));

    // ---- 7. spray needs RCP flow (acceptance #12)
    var sp = svc.assembleSnapshot();
    sp.control_state.spray_valve_pct = 60;
    sp.instruments.rcp_running = false;
    RD.PwrSynoptic.render(sp);
    var mistOn = Array.prototype.some.call(document.querySelectorAll('#pwPzrSprayMist .spray-mist'), function (m) { return m.classList.contains('on'); });
    ck('spray + RCP stopped: no mist', !mistOn);
    sp.instruments.rcp_running = true;
    RD.PwrSynoptic.render(sp);
    mistOn = Array.prototype.some.call(document.querySelectorAll('#pwPzrSprayMist .spray-mist'), function (m) { return m.classList.contains('on'); });
    ck('spray + RCP running: mist on', mistOn);

    // ---- 8. steam dump animates from the instrument only
    var dp = svc.assembleSnapshot();
    dp.instruments.steam_dump_valve = 45;
    RD.PwrSynoptic.render(dp);
    ck('steam dump dashes from instrument', document.getElementById('pwSteamDumpFlow').classList.contains('on'));

    // ---- 9. accumulators discharging: annunciation + flow UI + dashes
    var ac = svc.assembleSnapshot();
    ac.instruments.accumulators_discharging = true;
    ac.instruments.accumulator_flow = 0.4;
    RD.PwrSynoptic.render(ac);
    ck('accum discharging: dashes on', document.getElementById('pwAccumulatorFlow').classList.contains('on'));
    ck('accum discharging: annunciation shown', stage.querySelector('[data-f="accAnn"]').style.display !== 'none');
    ck('accum check valve opens', !document.getElementById('pwAccumulatorCheckValve').classList.contains('closed'));

    // ---- 10. emergency tab auto-select on actuation
    var em = svc.assembleSnapshot();
    em.instruments.afw_active = true;
    RD.PwrSynoptic.render(em);
    ck('AFW actuation selects AFW tab', stage.querySelector('.tabpane[data-pane="afw"]').classList.contains('on'));

    // ---- 11. pause freeze overlay
    var pz = svc.assembleSnapshot();
    pz.metadata.running = false;
    RD.PwrSynoptic.render(pz);
    ck('paused: stage class', stage.classList.contains('paused'));
    ck('paused: SIMULATION PAUSED overlay visible', visible(stage.querySelector('.pw-paused-overlay span')));
    pz.metadata.running = true;
    RD.PwrSynoptic.render(pz);
    ck('resume: overlay hidden', !stage.classList.contains('paused'));

    // ---- 12. two-step SCRAM cover
    var sb = stage.querySelector('[data-syn="scram"]');
    sb.click();
    ck('SCRAM first click arms (no command)', sb.classList.contains('armed') && cmds.length === 0);
    sb.click();
    ck('SCRAM second click fires', cmds.length === 1 && cmds[0].action === 'scram');

    // ---- 13. hover contract (programmatic mouseover)
    function hover(el, on) {
      el.dispatchEvent(new MouseEvent(on ? 'mouseover' : 'mouseout', { bubbles: true }));
    }
    var reliefCard = stage.querySelector('[data-card="relief"]');
    hover(reliefCard, true);
    ck('hover Relief card: gRelief highlighted', document.getElementById('gRelief').classList.contains('hl'));
    ck('hover Relief card: leader prominent', !!document.querySelector('#pwCardLeaders [data-lead="relief"].hl'));
    hover(reliefCard, false);
    hover(document.getElementById('pwPorv'), true);
    ck('hover pwPorv: Relief card highlighted', reliefCard.classList.contains('hl-card'));
    hover(document.getElementById('pwPorv'), false);
    hover(document.getElementById('pwTapSubcool'), true);
    ck('hover pwTapSubcool: bar linked', document.getElementById('pwSubcoolBar').classList.contains('wm-hint'));
    hover(document.getElementById('pwTapSubcool'), false);

    // ---- 14. contextual chips: xenon transient + fuel damage (Learning)
    var xs = svc.assembleSnapshot();
    xs.true_state.xenon_pct_eq = 140;
    xs.true_state.fuel_temp_c = 1300;
    RD.PwrSynoptic.render(xs);
    ck('xenon chip appears off-equilibrium', !!document.getElementById('pwXenonChip'));
    ck('fuel chip: damage occurring', document.getElementById('pwFuelStatus') &&
      /damage occurring/.test(document.getElementById('pwFuelStatus').textContent));
    ck('no raw fuel_temp_c on the board', stage.textContent.indexOf('1300') === -1);

    // ---- 15. RBMK/BWR untouched: unmount cleanly
    RD.PwrSynoptic.unmount();
    ck('unmount clears the stage', document.getElementById('host').innerHTML === '');

    document.getElementById('out').innerHTML =
      'SYNOPTIC CHECKS: ' + nPass + ' pass / ' + nFail + ' fail\n' + out.join('\n');
    document.title = nFail === 0 ? 'SYNOPTIC-OK' : 'SYNOPTIC-FAIL-' + nFail;
  })();
  </script>
</body>
</html>
