<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PWR Board — acceptance checks (dev)</title>
  <link rel="stylesheet" href="../diagram/board/pwr_board.css">
  <style>
    body { margin: 0; background: #0a0e13; overflow: auto; }
    #host { width: 1280px; height: 800px; position: relative; border: 1px solid #333; display: flex; flex-direction: column; }
    #out { font: 12px/1.5 Consolas, monospace; color: #d8dee9; white-space: pre; padding: 10px; }
    .p { color: #8ce0a6; } .f { color: #e08c8c; }
  </style>
</head>
<body>
  <div id="host"></div>
  <div id="out"></div>
  <script src="../../engines/load_mode.js"></script>
  <script src="../../engines/pwr/pwr_config.js"></script>
  <script src="../../layers/control/pwr_control.js"></script>
  <script src="../../engines/pwr/pwr_thermal.js"></script>

  <script src="../../engines/rbmk/rbmk_engine.js"></script>

  <script src="../../engines/bwr/bwr_instruments.js"></script>
  <script src="../../engines/bwr/bwr_engine.js"></script>

  <script src="../diagram/board/board_h.js"></script>
  <script src="../diagram/board/std_pipe.js"></script>
  <script src="../diagram/board/pwr_board_data.js"></script>
  <script src="../diagram/board/components/comp_reactor_vessel.js"></script>

  <script src="../diagram/board/components/comp_valve_horizontal.js"></script>
  <script src="../diagram/board/components/comp_valve_vertical.js"></script>
  <script src="../diagram/board/components/comp_turbine_generator.js"></script>
  <script src="../diagram/board/components/comp_condenser.js"></script>
  <script src="../diagram/board/components/comp_cooling_tower.js"></script>
  <script src="../diagram/board/components/comp_tee.js"></script>
  <script src="../diagram/board/components/comp_cross.js"></script>
  <script src="../diagram/board/components/comp_indicator_panel.js"></script>
  <script src="../diagram/board/pwr_board_inspect.js"></script>
  <script src="../diagram/board/pwr_board_wiring.js"></script>
  <script src="../diagram/board/pwr_board.js"></script>

  <script>
  (function () {
    'use strict';
    var RD = globalThis.RD;
    var out = [], nPass = 0, nFail = 0;
    function ck(name, cond, detail) {
      if (cond) { nPass++; out.push('<span class="p">PASS</span> ' + name); }
      else { nFail++; out.push('<span class="f">FAIL</span> ' + name + (detail != null ? '  [' + detail + ']' : '')); }
    }

    var svc = new RD.SimulationService({ plant_id: 'pwr', initial_state: 'hot_full_power' });
    var snap = svc.assembleSnapshot();

    var sentCommands = [];
    // Display units. This harness runs the board in US — the mode every check below was
    // written against — and the SI block at the bottom flips it deliberately.
    //
    // It used to pass `unit: 'si'`, a STRING, which nothing has ever read: WIRING_REFERENCE
    // described a `ctx.unit` selector that was never built, and app.js passes a `unit(dim)`
    // FUNCTION under that name. So this harness claimed to be testing SI and rendered US
    // for its whole life. The real accessor is `units()` (#238).
    var unitsMode = 'US';
    var ctx = {
      cmd: function (c) { sentCommands.push(c); return (svc.command ? svc.command(c) : svc.handleCommand(c)); },
      units: function () { return unitsMode; },
      mode: function () { return 'learning'; },
      overlay: function () { return false; }
    };

    RD.PwrBoard.mount(document.getElementById('host'), ctx);
    RD.PwrBoard.render(snap);

    setTimeout(function () {
      RD.PwrBoard.rescanPorts();
      RD.PwrBoard.render(svc.assembleSnapshot());

      var stage = document.querySelector('.pwr-board-stage');
      ck('board mounts', RD.PwrBoard.isMounted());
      ck('stage present', !!stage);
      var missing = [];
      (window.RD_PWR_BOARD_DOC.items || []).forEach(function (it) {
        if (it.kind !== 'component') return;
        if (!(RD.BoardComps && RD.BoardComps[it.comp])) missing.push(it.comp);
      });
      ck('all component modules registered', missing.length === 0, missing.join(','));
      var tiles = stage ? stage.querySelectorAll('.bd-tile').length : 0;
      ck('all items rendered (' + tiles + ')', tiles === (window.RD_PWR_BOARD_DOC.items || []).length, tiles);
      var portCount = Object.keys(RD.PwrBoard.ports()).length;
      ck('ports scanned (' + portCount + ' >= 40)', portCount >= 40, portCount);
      var pipes = stage ? stage.querySelectorAll('svg > g').length : 0;
      ck('pipes + flanges drawn (' + pipes + ')', pipes >= (window.RD_PWR_BOARD_DOC.pipes || []).length, pipes);
      var pendingPorts = (window.RD_PWR_BOARD_DOC.pipes || []).filter(function (p) {
        var bad = 0;
        [p.from, p.to].forEach(function (e) {
          if (typeof e === 'string' && !RD.PwrBoard.ports()[e]) bad++;
        });
        return bad > 0;
      }).map(function (p) { return p.id; });
      ck('every pipe endpoint resolves', pendingPorts.length === 0, pendingPorts.join(','));

      // ---- geometry: joints that must run plumb (#231) -------------------------
      // The pressurizer's three centreline ports scanned 6 px LEFT of both fittings they
      // join, so the surge line and the PORV tap each ran out of plumb between two
      // horizontal flange bars — visible on the board as "the pressurizer sits a little
      // left". comp_pressurizer.js corrects it with a measured translateX; these pin the
      // RESULT rather than the offset, so a re-export that moves either tile fails here
      // instead of silently restoring the jog.
      (function () {
        var P = RD.PwrBoard.ports();
        function plumb(name, a, b, axis) {
          var pa = P[a], pb = P[b];
          if (!pa || !pb) { ck(name, false, 'missing port: ' + (pa ? b : a)); return; }
          var d = pa[axis] - pb[axis];
          ck(name + ' (' + axis + ' ' + pa[axis] + ' vs ' + pb[axis] + ')', Math.abs(d) <= 1, 'off by ' + d);
        }
        plumb('geom: pressurizer surge line plumb to the hot-leg tee', 'pressurizer/surge', 'ims2kt7fu64/c', 'x');
        plumb('geom: pressurizer PORV tap plumb to the block valve', 'pressurizer/pressure-tap', 'imrppb3kuav/b', 'x');
        plumb('geom: pressurizer relief nozzle on the vessel axis', 'pressurizer/relief-out', 'pressurizer/surge', 'x');
        plumb('geom: SG feed line level with the feed tee (#237)', 'steamGenerator/fw-in', 'ims31q71cmu/a', 'y');
      })();

      if (RD.PwrBoardDriver && RD.PwrBoardDriver.selfTest) {
        RD.PwrBoardDriver.selfTest(ck, svc, sentCommands);
      }

      // ---- functional: click real board controls, confirm the engine responds ----
      function clickBtn(id) { var b = document.querySelector('[data-item="' + id + '"] button'); if (b) b.click(); return !!b; }
      function setNum(id, v) { var i = document.querySelector('[data-item="' + id + '"] input'); if (!i) return false; i.focus(); i.value = String(v); i.blur(); return true; }
      function cs() { return svc.assembleSnapshot().control_state; }
      function rps() { return svc.assembleSnapshot().rps_state; }
      // Step directly (do NOT use play/pause — start() arms a real timer that runs
      // wild under headless virtual-time and would trip the plant between checks).
      function ticks(n) { svc.running = true; for (var i = 0; i < n; i++) svc.tick(); svc.running = false; }

      clickBtn('imro900yzeq'); ck('func: spray MANUAL -> spray_auto false', cs().spray_auto === false);
      clickBtn('imro96h8lip'); ck('func: heater OFF -> heater_auto false & 0%', cs().heater_auto === false && cs().heater_power_pct === 0);
      clickBtn('imrmtimrch3'); ck('func: letdown A -> orifice A on / B off', cs().letdown_orifice_a === true && cs().letdown_orifice_b === false);
      clickBtn('imrmtimyxef'); ck('func: letdown A+B -> both on', cs().letdown_orifice_a === true && cs().letdown_orifice_b === true);
      clickBtn('imro8lddxi'); ck('func: generator MAN -> load_mode manual', cs().load_mode === 'manual');
      clickBtn('imrsjy59pnu'); ck('func: RCP OFF button -> rcp not running', cs().pumps.filter(function (p) { return p.id === 'rcp'; })[0].running === false);
      clickBtn('imrsjy1m9g'); ck('func: RCP ON button -> rcp running', cs().pumps.filter(function (p) { return p.id === 'rcp'; })[0].running === true);
      // charging panel is the charging pump's control (OFF = pump off)
      clickBtn('imrqn630s3b'); ck('func: charging OFF -> charging pump off', cs().charging_pump_running === false);
      clickBtn('imrmtg3r8ez'); ck('func: charging AUTO -> pump on + cvcs auto', cs().charging_pump_running === true && cs().cvcs_auto === true);
      clickBtn('imrprbi6ui1'); ck('func: charging MAN -> pump on + cvcs manual', cs().charging_pump_running === true && cs().cvcs_auto === false);
      // every pump is marked art-only (no built-in control box)
      ck('board: all 5 pumps art-only', ['imrobpq4a70','imrobnzlha1','imrobph7xrq','imrqp87ueqb','imrqvzbd9hd'].every(function (id) {
        return RD.PwrBoardDriver.suppressBuiltInControls(id);
      }));
      clickBtn('imrppquqg16'); ck('func: steam dump OPEN -> not auto', cs().steam_dump_auto === false);
      setNum('imro8rmka2y', 80); ck('func: generator load 80 MW -> load_target', Math.abs(cs().load_target_mwe - 80) < 1);
      setNum('imro8rmka2y', 850); ck('func: generator load clamps to rated (100 MW)', Math.abs(cs().load_target_mwe - 100) < 1);
      setNum('imrsg8b7b9o', 2100); ck('func: pressure setpoint 2100 psi -> ~14.48 MPa', Math.abs(cs().pressure_setpoint - 2100 / 145.038) < 0.05);

      // --- instructor glow ---
      ck('glow: revealControl(HPI) returns a tile', !!RD.PwrBoard.revealControl('HPI'));
      ck('glow: revealControl(SCRAM) returns a tile', !!RD.PwrBoard.revealControl('SCRAM'));
      ck('glow: revealControl(unknown) is null', RD.PwrBoard.revealControl('Nonsense') === null);
      ck('glow: highlightLabels covers the vocab (>=30)', RD.PwrBoard.highlightLabels.length >= 30);
      RD.PwrBoard.setTag('afw_tag', true);
      var tagEl = document.querySelector('.bd-maint-tag');
      ck('glow: setTag shows maintenance tag', !!tagEl && tagEl.style.display !== 'none');
      RD.PwrBoard.setTag(null, false);
      ck('glow: setTag hides the tag', !document.querySelector('.bd-maint-tag') || document.querySelector('.bd-maint-tag').style.display === 'none');

      // --- boron control now runs in the control/automation layer ---
      function chanOf(id) { return svc.assembleSnapshot().automation.channels.filter(function (c) { return c.id === id; })[0]; }
      clickBtn('imrqp6com2b'); ticks(2);
      ck('func: BORON ON engages boron_conc channel', !!(chanOf('boron_conc') && chanOf('boron_conc').engaged));
      setNum('imrpq29jo7t', 850); ticks(2);
      ck('func: boron target 850 -> channel setpoint', Math.abs((chanOf('boron_conc') || {}).setpoint - 850) < 1);
      clickBtn('imrqp6avzkw'); ticks(2);
      ck('func: BORON OFF disengages the channel', !(chanOf('boron_conc') && chanOf('boron_conc').engaged));
      // ROD AUTO toggle (EXTRA_ITEMS, #237) — the rods_tavg channel's board control.
      // The toggle reads the channel state off the RENDERED snapshot (SR DET pattern),
      // so re-render between clicks — in the app every broadcast does this.
      //
      // STARTS ENGAGED since #289 *(OWNER RULING, 2026-08-01: "Let's start the rods in auto.
      // Might as well, everything else starts in auto.")*, so the first click DISENGAGES.
      // The old pair asserted engage-then-disengage and inverted the moment the lineup
      // changed — they were reading the shipped default, not the toggle. Pinned as three
      // now: the default itself, then both directions from it.
      ck('func: ROD AUTO comes up ENGAGED on a Mode 1 start (#289)',
        !!(chanOf('rods_tavg') && chanOf('rods_tavg').engaged));
      clickBtn('ims5glucngg'); ticks(2);
      ck('func: ROD AUTO disengages rods_tavg', !(chanOf('rods_tavg') && chanOf('rods_tavg').engaged));
      RD.PwrBoard.render(svc.assembleSnapshot());
      clickBtn('ims5glucngg'); ticks(2);
      ck('func: ROD AUTO re-engages rods_tavg', !!(chanOf('rods_tavg') && chanOf('rods_tavg').engaged));
      RD.PwrBoard.render(svc.assembleSnapshot());
      // Leave it DISENGAGED for the rest of the harness: the physics-perturbing checks below
      // were all authored against a hand-controlled plant, and an active rod controller would
      // quietly change what they are measuring.
      clickBtn('ims5glucngg'); ticks(2);
      RD.PwrBoard.render(svc.assembleSnapshot());

      // rods: the WITHDRAW/INSERT buttons are momentary (tap-or-hold). A quick TAP
      // (pointerdown then pointerup before the hold threshold) nudges EXACTLY ONE step;
      // the nudge_target clamps it so extra ticks never carry it further. (The
      // hold-to-drive path uses a real 220 ms timer and is covered by the interactive
      // playwright check, not this synchronous harness.)
      function rodTap(id) {
        var b = document.querySelector('[data-item="' + id + '"] button');
        b.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
        document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
      }
      function ctlSteps() { return cs().rod_groups.filter(function (g) { return g.id === 'control_rods'; })[0].steps; }
      clickBtn('imrpk8kjsjs'); // fast
      var beforeSteps = ctlSteps();
      rodTap('imrpk6qzjq8'); ticks(30);
      var afterSteps = ctlSteps();
      ck('func: rod WITHDRAW tap moves control bank up exactly one step', afterSteps === beforeSteps + 1, beforeSteps + '->' + afterSteps);

      // TRIP BLOCKS button: neutral GREY (bd-info) + count badge while trips are blocked
      // (a standing lineup note, not an alarm). At hot_full_power the at-power startup net
      // (ir_high + pr_low_setpoint) is blocked.
      function tripBtn() { return document.querySelector('[data-item="imrsk4xz2dm"] button'); }
      function tripBadge() { var b = tripBtn() && tripBtn().querySelector('.bd-badge'); return b && b.style.display !== 'none' ? b.textContent : null; }
      RD.PwrBoard.render(svc.assembleSnapshot());
      var blk0 = Object.keys(rps().trip_blocks).filter(function (k) { return rps().trip_blocks[k]; }).length;
      ck('info: TRIP BLOCKS grey when trips blocked', tripBtn().classList.contains('bd-info') && !tripBtn().classList.contains('bd-warn'), blk0);
      ck('info: TRIP BLOCKS badge shows blocked count', tripBadge() === String(blk0), tripBadge() + ' vs ' + blk0);
      // TRIP BLOCKS popover + block a trip
      clickBtn('imrsk4xz2dm');
      var popOpen = !!document.querySelector('.bd-pop');
      ck('func: TRIP BLOCKS opens popover', popOpen);
      var beforeBlk = !!rps().trip_blocks.ir_high;
      var tb = document.querySelector('.bd-pop button[data-trip="ir_high"]');
      // UNBLOCK, CHECK, RE-BLOCK — all WITHOUT stepping the plant. This ordering is
      // load-bearing (pre-existing defect, found 2026-08-01), not style.
      //
      // At hot_full_power `ir_high` starts BLOCKED (the at-power lineup) and the IR channel
      // reads 2.0e-3 against a 1.67e-3 setpoint — the trip condition is STANDING, and the
      // block is the only thing holding it off. The old code unblocked it and then ran
      // `ticks(2)`, which let protection evaluate and SCRAMMED the plant immediately
      // (measured: `intermediate_range high`). The toggle was never undone, so every check
      // below this line — the ESF triad, pumps, feed, the SCRAM two-step — had been running
      // on a dead reactor at ~3 % power. It surfaced only as the SCRAM two-step "failing":
      // on an already-scrammed plant those two clicks are the #75 RESET half, so the harness
      // un-scrammed the reactor and then asserted it was scrammed. The plant was correct at
      // every step; the harness was standing on its own foot.
      //
      // Re-blocking cannot undo it after the fact either — `rps.scrammed` LATCHES, and the
      // reset is then refused while the plant is at 0 % with a standing trip. So the block
      // state is asserted from the kernel (immediate, no stepping needed) and the block is
      // restored BEFORE protection ever gets a chance to look.
      if (tb) tb.click();
      ck('func: block ir_high toggles trip_blocks', (!!rps().trip_blocks.ir_high) !== beforeBlk, 'was ' + beforeBlk);
      RD.PwrBoard.render(svc.assembleSnapshot());
      var blk1 = Object.keys(rps().trip_blocks).filter(function (k) { return rps().trip_blocks[k]; }).length;
      ck('warn: badge tracks count after toggle', tripBadge() === (blk1 > 0 ? String(blk1) : null), tripBadge() + ' vs ' + blk1);
      if (tb) tb.click();
      ck('func: ir_high block RESTORED before the plant is stepped',
        !!rps().trip_blocks.ir_high === beforeBlk, 'back to ' + beforeBlk);
      ticks(2);
      ck('func: …and the plant is still LIVE — unblocking at power would have scrammed it',
        svc.assembleSnapshot().instruments.rps_scrammed === false);
      RD.PwrBoard.render(svc.assembleSnapshot());

      // --- ESF AUTO/ON/OFF triad: AUTO re-arms; the AUTO tile lights when armed ---
      function esfState(id) { return (svc.assembleSnapshot().automation.esf || {})[id]; }
      function tileActive(id) { var b = document.querySelector('[data-item="' + id + '"] button'); return !!b && b.classList.contains('bd-active'); }
      // HPI: force MANUAL via STOP, then re-arm via AUTO
      clickBtn('imrldz0wqds'); ticks(2);
      ck('func: HPI STOP -> esf.hpi manual', esfState('hpi') === 'manual', esfState('hpi'));
      RD.PwrBoard.render(svc.assembleSnapshot());
      ck('feedback: HPI AUTO tile dark while MANUAL', !tileActive('imrle1mc0lk'));
      clickBtn('imrle1mc0lk'); ticks(2);
      ck('func: HPI AUTO -> esf.hpi auto', esfState('hpi') === 'auto', esfState('hpi'));
      RD.PwrBoard.render(svc.assembleSnapshot());
      ck('feedback: HPI AUTO tile lit when armed', tileActive('imrle1mc0lk'));
      ck('feedback: HPI OFF tile dark when armed', !tileActive('imrldz0wqds'));
      // AFW: force MANUAL via STOP, then re-arm via AUTO
      clickBtn('imrmssoa137'); ticks(2);
      ck('func: AFW STOP -> esf.afw manual', esfState('afw') === 'manual', esfState('afw'));
      clickBtn('imrmssr9ihq'); ticks(2);
      ck('func: AFW AUTO -> esf.afw auto', esfState('afw') === 'auto', esfState('afw'));
      RD.PwrBoard.render(svc.assembleSnapshot());
      ck('feedback: AFW AUTO tile lit when armed', tileActive('imrmssr9ihq'));

      // --- Generator FOLLOW / MAN / OFF: a planned offline is NOT a turbine trip (#230) ---
      // The OFF lamp used to key on `turbine_tripped`. Once disconnect_grid became a planned
      // offline that does not trip the turbine, that keying would have left the whole
      // selector dark after a normal disconnect — a board defect no other gate covers.
      //
      // This block does NOT get an at-power plant: the RCP OFF click near the top of the
      // functional section stops the pumps at full power, which scrams the reactor and
      // trips the turbine. So it establishes the one precondition the claim actually needs
      // — a turbine that is NOT tripped — drives its own events rather than borrowing the
      // scram's, and puts the plant back as it found it (tripped, off line) so the pipe-
      // animation checks below still see the state they were written against.
      svc.handleCommand({ action: 'connect_grid' }); ticks(4);
      var g0 = svc.assembleSnapshot();
      ck('precondition: turbine not tripped before the offline checks',
        g0.instruments.turbine_tripped === false, 'tripped=' + g0.instruments.turbine_tripped);
      clickBtn('imro8len0oi'); ticks(4);
      var g1 = svc.assembleSnapshot();
      ck('func: OFF -> load_mode disconnected', (g1.control_state || {}).load_mode === 'disconnected',
        (g1.control_state || {}).load_mode);
      ck('func: a PLANNED offline does NOT trip the turbine (#230)',
        g1.instruments.turbine_tripped === false, String(g1.instruments.turbine_tripped));
      RD.PwrBoard.render(g1);
      ck('feedback: OFF tile lit while off line', tileActive('imro8len0oi'));
      ck('feedback: FOLLOW tile dark while off line', !tileActive('imro8ktzs3u'));
      ck('feedback: MAN tile dark while off line', !tileActive('imro8lddxi'));
      // the other half: a REAL turbine trip must still light OFF
      svc.handleCommand({ action: 'trip_turbine' }); ticks(4);
      var g2 = svc.assembleSnapshot();
      ck('func: trip_turbine does trip the turbine', g2.instruments.turbine_tripped === true);
      RD.PwrBoard.render(g2);
      ck('feedback: OFF tile lit on a real turbine trip', tileActive('imro8len0oi'));
      // FOLLOW must clear the trip and re-synchronise — a planned offline is reversible
      clickBtn('imro8ktzs3u'); ticks(4);
      var g3 = svc.assembleSnapshot();
      RD.PwrBoard.render(g3);
      ck('func: FOLLOW puts it back on line', (g3.control_state || {}).load_mode === 'follow' &&
        g3.instruments.turbine_tripped === false, (g3.control_state || {}).load_mode);
      ck('feedback: FOLLOW tile lit back on line', tileActive('imro8ktzs3u'));
      ck('feedback: OFF tile dark back on line', !tileActive('imro8len0oi'));
      // SCRAM two-step: arm then confirm. It lives HERE, in the one window where the plant is
      // on line with no standing trip signal — this is the whole fix to a pre-existing red
      // (found 2026-08-01, board_check had been 1 FAILURE/143 while CLAUDE.md claimed 143/143).
      //
      // It used to sit below the feed-collapse block, by which point the plant was ALREADY
      // scrammed, and on an already-scrammed plant those two clicks are the #75 RESET half —
      // so the check un-scrammed the reactor and then asserted it was scrammed. Two separate
      // things put it there, and both are legitimate plant behaviour: the turbine trip a few
      // lines up correctly scrams above P-9 (#216), and securing the condensate pump collapses
      // main feed until the plant trips itself. The button was never at fault.
      //
      // The reset first is not a workaround — it covers the #75 reset path from the board,
      // which nothing else here did. It only succeeds because FOLLOW re-synchronised the
      // turbine above (no `turbine_tripped` signal standing); the deliberate re-trip that
      // hands the block back tripped has to come AFTER this.
      // Wait for the rods to SEAT first. The scram above is only a few ticks old and the
      // reset permissive is `rods_fully_in` — measured, an immediate reset is refused
      // RODS_NOT_INSERTED with the plant still coasting at 95 % power, which is the interlock
      // doing its job, not a defect.
      for (var rw = 0; rw < 400 && !svc.assembleSnapshot().instruments.rods_fully_in; rw++) ticks(1);
      var rrsp = svc.handleCommand({ action: 'reset_rps' }); ticks(4);
      ck('func: RPS reset clears the turbine-trip scram (#75 reset path)',
        svc.assembleSnapshot().instruments.rps_scrammed === false,
        (rrsp && rrsp.reason) || (rrsp && rrsp.message) || 'no refusal');
      // RE-RENDER before clicking. The #75 SCRAM control is dual-mode — it is the RESET
      // button while the plant is scrammed — and it reads which half it is off the RENDERED
      // snapshot, not off the live service. Without this the button is still in RESET mode
      // from the render above and the two clicks do nothing to an already-reset plant.
      RD.PwrBoard.render(svc.assembleSnapshot());
      var scr = document.querySelector('[data-item="imrqr8ecji6"] button');
      if (scr) { scr.click(); scr.click(); }
      ticks(3);
      ck('func: SCRAM two-step trips the reactor', svc.assembleSnapshot().instruments.rps_scrammed === true);

      // hand the plant back tripped and off line, the way this block found it
      svc.handleCommand({ action: 'trip_turbine' }); ticks(4);

      // --- physics-perturbing checks LAST (they degrade the plant) ---
      // condensate pump has no board control (owner: it doesn't need operating), but the
      // engine still models it — securing it collapses main feed. Exercise via the command.
      svc.handleCommand({ action: 'set_condensate_pump', running: false }); ticks(30);
      ck('func: condensate pump OFF (engine) collapses main feed', svc.assembleSnapshot().instruments.condensate_flow < 0.3);
      svc.handleCommand({ action: 'set_condensate_pump', running: true });
      svc.handleCommand({ action: 'set_afw', active: true }); ticks(20);
      ck('func: AFW discharge pressure real (>0 when pumps demanded)', svc.assembleSnapshot().instruments.afw_discharge_pressure > 0);
      svc.handleCommand({ action: 'set_hpi', active: true }); ticks(10);
      ck('func: HPI discharge pressure real (>0 when injecting)', svc.assembleSnapshot().instruments.hpi_discharge_pressure > 0);
      svc.handleCommand({ action: 'set_hpi', active: false }); svc.handleCommand({ action: 'set_afw', active: false });

      // (The SCRAM two-step moved ABOVE the feed-collapse block — see the note there.)

      // ---- pipe animation vs plant state (#236) --------------------------------
      // The harness used to assert pipe EXISTENCE only, so a board showing forced
      // circulation on a dead plant scored PASS. These pin play-state against the
      // plant in three states: post-scram (dump carrying decay heat — just tripped
      // above), then a fresh Mode 5 service, then implicitly the full-power state
      // (the earlier interactive checks perturbed this svc, so its full-power pins
      // ran on the fresh svc2 comparison below instead).
      function pipeState(id) { return RD.PwrBoard.pipeFlowState(id); }
      ticks(15);   // let the trip-open dump drive open on the Tavg error
      RD.PwrBoard.render(svc.assembleSnapshot());
      ck('pipe: post-scram steam dump line RUNNING (dump carries decay heat)',
        pipeState('pmrr0u9nib3') === 'running', pipeState('pmrr0u9nib3'));
      ck('pipe: post-scram PORV relief line PAUSED (PORV seated, dead-ended line)',
        pipeState('pms3tda86bw') === 'paused', pipeState('pms3tda86bw'));

      // Fresh hot-full-power service: the shipped default state, unperturbed.
      var svcHfp = new RD.SimulationService({ plant_id: 'pwr', initial_state: 'hot_full_power' });
      RD.PwrBoard.render(svcHfp.assembleSnapshot());
      ck('pipe: full power hot leg RUNNING', pipeState('pms2ktjq4ma') === 'running', pipeState('pms2ktjq4ma'));
      ck('pipe: full power main steam RUNNING', pipeState('pmrr0u4vgri') === 'running', pipeState('pmrr0u4vgri'));
      ck('pipe: full power turbine exhaust RUNNING', pipeState('pmrr14xbt2h') === 'running', pipeState('pmrr14xbt2h'));
      ck('pipe: full power RWST->ECCS suction PAUSED (HPI off; pump-init gate, #236)',
        pipeState('pms3x1rbkod') === 'paused', pipeState('pms3x1rbkod'));
      ck('pipe: full power PORV relief line PAUSED (dead-ended, PORV seated)',
        pipeState('pms3tda86bw') === 'paused', pipeState('pms3tda86bw'));
      ck('pipe: full power steam dump branch PAUSED (dump shut at power)',
        pipeState('pmrr46oahnx') === 'paused', pipeState('pmrr46oahnx'));
      // PZR indication pair (EXTRA_ITEMS, #237): temperature = saturation at RCS
      // pressure (~653 °F at operating pressure), heater power = live actual output.
      (function () {
        var tt = document.querySelector('[data-item="ims5gq44zgr"]');
        var tv = tt ? parseInt((tt.textContent.match(/\d+/) || ['0'])[0], 10) : 0;
        ck('readout: PZR TEMP reads saturation (600-700 F at power)', tv > 600 && tv < 700, tt && tt.textContent);
        var ht = document.querySelector('[data-item="ims5gprvl7n"]');
        ck('readout: PZR HTR PWR live indication numeric', !!ht && /\d/.test(ht.textContent), ht && ht.textContent);
      })();

      // Cold Shutdown (Mode 5): RCPs secured, no steam, no feed — a dead plant must
      // read STILL. 23 of 37 pipes animated here before #236.
      var svc5 = new RD.SimulationService({ plant_id: 'pwr', initial_state: 'cold_shutdown' });
      RD.PwrBoard.render(svc5.assembleSnapshot());
      ck('pipe: Mode 5 hot leg PAUSED (RCPs secured)', pipeState('pms2ktjq4ma') === 'paused', pipeState('pms2ktjq4ma'));
      ck('pipe: Mode 5 cold leg PAUSED', pipeState('pms2kozvu94') === 'paused', pipeState('pms2kozvu94'));
      ck('pipe: Mode 5 main steam PAUSED (no steam flow)', pipeState('pmrr0u4vgri') === 'paused', pipeState('pmrr0u4vgri'));
      ck('pipe: Mode 5 turbine exhaust PAUSED', pipeState('pmrr14xbt2h') === 'paused', pipeState('pmrr14xbt2h'));
      ck('pipe: Mode 5 feed line PAUSED (no feed flow)', pipeState('pms31qjbqhy') === 'paused', pipeState('pms31qjbqhy'));

      // #235 board defects, pinned in the same states:
      function tileText(id) { var t = document.querySelector('[data-item="' + id + '"]'); return t ? t.textContent : ''; }
      ck('readout: Mode 5 ECCS MODE shows RHR (was dead "OFF", #235)',
        /RHR/.test(tileText('ims3w61jjbi')), tileText('ims3w61jjbi'));
      var rpmTxt = (tileText('imrppee04aj').match(/-?\d+/) || ['NaN'])[0];
      ck('readout: Mode 5 turbine rpm reads ~0 (was pinned 1800, #235)',
        Math.abs(parseInt(rpmTxt, 10)) < 100, tileText('imrppee04aj'));
      // authored-geometry corrections (DOC_PATCHES + label tracking, #235/#236):
      var roLabel = document.querySelector('[data-item="imrzmlyafa3"] .bd-ro-label');
      ck('geom: STEAM DUMP readout label fits its tile',
        !!roLabel && roLabel.scrollWidth <= roLabel.parentElement.clientWidth,
        roLabel && (roLabel.scrollWidth + ' vs ' + roLabel.parentElement.clientWidth));
      ck('geom: STEAM DUMP readout clear of the dump valve tile',
        (function () { var it = (window.RD_PWR_BOARD_DOC.items || []).filter(function (i) { return i.id === 'imrzmlyafa3'; })[0]; return it && it.left >= 1414; })());
      ck('geom: NIS delta-T caption reads "Δ TEMP AVG"',
        /Δ TEMP AVG/.test(tileText('imrsho1qu6t')), tileText('imrsho1qu6t'));
      (function () {
        var spTile = document.querySelector('[data-item="ims31tq7mgc"]');
        var spLab = spTile && spTile.querySelector('div');
        ck('geom: DUMP SETPOINT range hint fits its box',
          !!spLab && spLab.scrollWidth <= spTile.clientWidth,
          spLab && (spLab.scrollWidth + ' vs ' + spTile.clientWidth));
      })();
      (function () {
        var P = RD.PwrBoard.ports();
        var su = P['imrobpq4a70/suction'], di = P['imrobpq4a70/discharge'];
        ck('geom: RCP suction on the loop-inlet (right) side, discharge on the outlet (#236)',
          !!su && !!di && su.x > di.x, su && di && (su.x + ' vs ' + di.x));
      })();

      // ---- inspection (#96): the board half of the inspection block -------------
      // run_inspect.js gates the COPY (coverage, citations, no orphan keys). What
      // needs a mounted board is the RESOLUTION: a DOM node → the item it belongs
      // to, and the geometric fallback for tiles the pointer can never hit.
      (function () {
        var B = RD.PwrBoard;
        var e1 = B.inspect('imrpk6qzjq8');                       // control-bank WITHDRAW
        ck('inspect: a control describes itself', !!e1 && e1.inherited === false && /WITHDRAW/i.test(e1.title || ''),
          e1 && e1.title);
        var e2 = B.inspect('ims2jv3wydh');                       // "BORON CHEM" caption
        ck('inspect: a caption inherits its card', !!e2 && e2.inherited === true && /Boron/i.test(e2.title || ''),
          e2 && (e2.title + ' inherited=' + e2.inherited));
        ck('inspect: an unknown id resolves to nothing', B.inspect('not-an-item') === null);

        var btn = document.querySelector('[data-item="imrpk6qzjq8"] button');
        ck('inspect: a click target resolves to its item', !!btn && B.itemIdFor(btn) === 'imrpk6qzjq8',
          btn && B.itemIdFor(btn));

        // The reactor vessel is deliberately click-through so the rod buttons it
        // overlaps stay reachable — which is exactly why the DOM cannot resolve it
        // and geometry has to. If the pointer-events ever come back, this pair says
        // so rather than the inspection silently going quiet over the vessel.
        var vt = B.tileFor('reactorVessel');
        ck('inspect: the reactor vessel tile is click-through', !!vt && vt.style.pointerEvents === 'none',
          vt && vt.style.pointerEvents);
        (function () {
          if (!vt) { ck('inspect: geometry resolves the reactor vessel', false, 'no tile'); return; }
          var r = vt.getBoundingClientRect();
          var id = B.itemIdAt(r.left + r.width / 2, r.top + r.height / 2);
          ck('inspect: geometry resolves the reactor vessel', id === 'reactorVessel', id);
        })();
        // Paint order: a lifted control sitting on a card must win the hit test
        // against the card underneath it.
        (function () {
          var t = B.tileFor('imrmtg3r8ez');                      // CHARGING AUTO, on the CHARGING card
          if (!t) { ck('inspect: geometry honours paint order', false, 'no tile'); return; }
          var r = t.getBoundingClientRect();
          var id = B.itemIdAt(r.left + r.width / 2, r.top + r.height / 2);
          ck('inspect: geometry honours paint order', id === 'imrmtg3r8ez', id);
        })();
        // Every control the instructor can point at is also inspectable — the two
        // vocabularies name the same objects and must not drift apart.
        (function () {
          var miss = RD.PwrBoard.highlightLabels.filter(function (lab) {
            var id = RD.PwrBoardDriver.controlLabelItem(lab);
            return id && !B.inspect(id);
          });
          ck('inspect: every highlight target inspects', miss.length === 0, miss.join(','));
        })();
      })();

      // ---- display units (#238): the SI half of the board -----------------------
      // Runs LAST and restores US, because every check above was written against the
      // US board and would read a different number under SI.
      //
      // What these pin is the SEAM, not the arithmetic: that flipping ctx.units()
      // reaches all four surfaces (readouts, tiles, setpoint boxes, range hints), that
      // it reaches them WITHOUT a remount, and that flipping back restores the authored
      // board exactly. Before #238 the board had no such seam at all — the conversions
      // were inline in ~30 formatters and the unit strings were baked into the
      // generated board data — which is why the Settings SI position was disabled
      // while the PWR was up (#237).
      (function () {
        var d = RD.PwrBoardDriver;
        function item(id) { return (window.RD_PWR_BOARD_DOC.items || []).filter(function (i) { return i.id === id; })[0]; }
        function valOf(id) {                      // "579 F" -> the rendered number+unit
          var t = document.querySelector('[data-item="' + id + '"]');
          return t ? t.textContent.replace(/\s+/g, ' ').trim() : null;
        }
        function numOf(id) {                      // a setpoint box: its value and its unit span
          var t = document.querySelector('[data-item="' + id + '"]');
          var i = t && t.querySelector('input'), u = t && t.querySelector('.bd-num-unit');
          return { v: i && i.value, u: u && u.textContent };
        }
        // Every item whose text is a pure function of the snapshot. COMPONENTS are excluded
        // on purpose: the indicator-panel tiles ANIMATE their reading toward the target, so
        // two renders of the same snapshot legitimately paint different numbers and a text
        // comparison over them tests the animation, not the units. Their restore is checked
        // through compProps() below, which is deterministic.
        function snapAll() {
          var o = {};
          document.querySelectorAll('.pwr-board-stage [data-item]').forEach(function (t) {
            var it = item(t.getAttribute('data-item'));
            if (it && it.kind === 'component') return;
            o[t.getAttribute('data-item')] = t.textContent;
          });
          return o;
        }
        var TILES = ['imrzl4b7g9m', 'ims2immk7ks', 'ims2immxl2s', 'ims2immsvn6', 'ims2immon9z', 'ims2imn1nny'];
        function tileProps(s) {
          return TILES.map(function (id) { return id + '=' + JSON.stringify(d.compProps(item(id), s)); }).join('|');
        }
        var s0 = svc.assembleSnapshot();
        unitsMode = 'US'; RD.PwrBoard.render(s0);
        var beforeUS = snapAll(), beforeTiles = tileProps(s0);
        var usTavg = valOf('ims2immk7ks'), usDT = valOf('imro6qpci2d'), usFeed = valOf('imrsgkz4lq0');
        var usDump = numOf('ims31tq7mgc'), usPzrLvl = valOf('ims2immon9z');

        // --- flip, WITHOUT remounting. A re-render is all the board ever gets.
        unitsMode = 'SI'; RD.PwrBoard.render(s0);

        ck('units: SI flips a readout without a remount', RD.PwrBoard.isMounted() && valOf('ims2immk7ks') !== usTavg,
          usTavg + ' -> ' + valOf('ims2immk7ks'));
        // Tavg, the tile: 304 °C is 579 °F. Read the tile props rather than the painted
        // text so a font/rounding change cannot make this pass for the wrong reason.
        (function () {
          var p = d.compProps(item('ims2immk7ks'), s0);
          ck('units: SI Tavg tile reads °C, not °F', p.unit === 'C' && p.value > 250 && p.value < 350,
            p.unit + ' ' + p.value);
          ck('units: SI Tavg tile bands are °C too (the band cannot be in a different unit than the reading)',
            p.tripHi > 300 && p.tripHi < 400 && p.normHi < 320, p.tripHi + ' / ' + p.normHi);
        })();
        // Primary pressure: MPa needs TWO decimals or the pressurizer's whole control
        // band collapses onto one displayed value (15.20-15.76 would both read "15").
        (function () {
          var p = d.compProps(item('ims2immsvn6'), s0);
          ck('units: SI pressure tile is MPa at 2 decimals', p.unit === 'MPa' && p.decimals === 2 && p.value > 10 && p.value < 20,
            p.unit + ' ' + p.decimals + ' ' + p.value);
        })();
        // THE UNIT TRAP. Subcooling margin is a temperature DIFFERENCE: 41 °C is 73.8 °F,
        // NOT 105.8. The absolute rule reads as a HEALTHIER margin than the plant has, and
        // it is the error `run_manual_units` exists to catch in prose — the board can make
        // it too. Same for the NIS leg ΔT below.
        (function () {
          var us = d.compProps(item('ims2immxl2s'), s0);   // still SI right now
          var si = us.value;
          unitsMode = 'US'; RD.PwrBoard.render(s0);
          var usv = d.compProps(item('ims2immxl2s'), s0).value;
          unitsMode = 'SI'; RD.PwrBoard.render(s0);
          ck('units: subcooling converts as a DIFFERENCE (x9/5, no 32° offset)',
            Math.abs(usv - si * 9 / 5) < 0.5 && Math.abs(usv - (si * 9 / 5 + 32)) > 10,
            si.toFixed(2) + ' C -> ' + usv.toFixed(2) + ' F');
        })();
        (function () {
          var si = parseFloat(valOf('imro6qpci2d')), us = parseFloat(usDT);
          ck('units: SI leg ΔT is a difference, not an absolute temperature',
            / C$/.test(valOf('imro6qpci2d')) && Math.abs(us - si * 9 / 5) <= 1 && Math.abs(us - (si * 9 / 5 + 32)) > 10,
            usDT + ' -> ' + valOf('imro6qpci2d'));
        })();
        // Flow. gpm is an authored display scale, so SI is m³/h (owner selection).
        ck('units: SI flow reads m³/h', /m³\/h$/.test(valOf('imrsgkz4lq0')) && usFeed !== valOf('imrsgkz4lq0'),
          usFeed + ' -> ' + valOf('imrsgkz4lq0'));
        // A unit-NEUTRAL indication must not move. Half the board is %/ppm/MW/rpm, and a
        // layer that converted those would be worse than no layer.
        ck('units: a unit-neutral readout does not move', valOf('ims2immon9z') === usPzrLvl, usPzrLvl);

        // --- setpoint boxes: value, unit span, decimals, ▲▼ step, bounds and the range hint
        (function () {
          var n = numOf('ims31tq7mgc');
          ck('units: SI setpoint box shows MPa (the unit span is LIVE, not built once)',
            n.u === 'MPa' && usDump.u === 'psi', usDump.u + ' -> ' + n.u);
          ck('units: SI setpoint box gains decimals', /\./.test(n.v) && !/\./.test(usDump.v || '.'),
            usDump.v + ' -> ' + n.v);
          var it = item('ims31tq7mgc'), b = d.boundsFor(it);
          ck('units: SI bounds are the engine clip in MPa', b[0] === 0.2 && b[1] === 9.31, JSON.stringify(b));
          ck('units: SI ▲▼ step is 0.01 MPa, not 1', d.stepFor(it) === 0.01, d.stepFor(it));
          // The hint is DERIVED from the bounds in SI, so it cannot drift from them.
          ck('units: SI range hint is derived from the bounds', d.numberHint(it) === '0.2-9.31 MPa', d.numberHint(it));
          ck('units: SI charging box keeps a usable resolution (0-13.6 m³/h at 0.1)',
            d.numberDigits(item('imrpq48hn3t')) === 1 && d.stepFor(item('imrpq48hn3t')) === 0.1,
            d.numberDigits(item('imrpq48hn3t')) + ' / ' + d.stepFor(item('imrpq48hn3t')));
        })();
        // A typed SI value must reach the engine as SI. If onNumber forwarded the raw box
        // value, 6 MPa would be commanded as 6 psi-worth and the plant would depressurize.
        (function () {
          sentCommands.length = 0;
          setNum('imrsg8b7b9o', 6);
          var c = sentCommands.filter(function (x) { return x.action === 'set_pressure_setpoint'; }).pop();
          ck('units: a value typed in MPa is commanded in MPa', !!c && Math.abs(c.mpa - 6) < 1e-9, c && c.mpa);
          unitsMode = 'US'; RD.PwrBoard.render(svc.assembleSnapshot());
          sentCommands.length = 0;
          setNum('imrsg8b7b9o', 2235);
          var c2 = sentCommands.filter(function (x) { return x.action === 'set_pressure_setpoint'; }).pop();
          ck('units: the SAME box typed in psi is still commanded in MPa', !!c2 && Math.abs(c2.mpa - 15.41) < 0.01, c2 && c2.mpa);
        })();

        // --- back to US: the authored board must return EXACTLY, every tile.
        // This is the check that catches a one-way conversion — a unit span overwritten
        // with 'MPa' and never restored looks fine until someone switches back.
        svc.command ? svc.command({ action: 'set_pressure_setpoint', mpa: 15.41 })
                    : svc.handleCommand({ action: 'set_pressure_setpoint', mpa: 15.41 });
        unitsMode = 'US'; RD.PwrBoard.render(s0);
        (function () {
          var after = snapAll(), diff = [];
          Object.keys(beforeUS).forEach(function (k) { if (beforeUS[k] !== after[k]) diff.push(k); });
          ck('units: SI -> US restores the authored board exactly (' + Object.keys(beforeUS).length + ' items)',
            diff.length === 0, diff.slice(0, 6).join(','));
          ck('units: SI -> US restores every vital tile band and unit',
            tileProps(s0) === beforeTiles, 'tile props differ');
        })();

        // Band QUANTISATION has to be per-unit, and this is the check that says so. Band
        // edges are rounded to stop the tile strip flickering at the render rate, and the
        // quantum used to be a whole display unit — fine at 1 psi, catastrophic at 1 MPa,
        // which is 145 of them: the pressurizer's 15.20-15.76 control band and its
        // 14.82/15.86 alarms all collapse onto 15 and 16, and the seven regions the tile
        // paints stop being distinguishable. Assert the nesting survives, in BOTH families
        // that quantise (pressure at 0.01 MPa, temperature at 0.5 °C) — a tile whose normal
        // band has merged into its alarm band is telling the operator nothing.
        (function () {
          // On a FRESH hot_full_power plant, not the one the checks above have driven
          // around: by this point the pressure setpoint has been moved and the normal band
          // legitimately clamps onto its own alarm, which is #270's guard doing its job and
          // not a resolution defect. The claim here is about the design case.
          //
          // It runs AFTER the restore checks and re-asserts SI for itself, on purpose and in
          // that order: assembling a foreign snapshot walks the driver's one-entry damping
          // memo (IN()), so doing this mid-sequence perturbed the very tile values the
          // restore comparison was about to check. Both halves of that are easy to get
          // wrong — an SI check that silently ran in US measured nothing at all.
          var s1 = new RD.SimulationService({ plant_id: 'pwr', initial_state: 'hot_full_power' }).assembleSnapshot();
          unitsMode = 'SI';
          var bad = [];
          [['ims2immsvn6', 'pressure'], ['ims2immk7ks', 'Tavg']].forEach(function (e) {
            var p = d.compProps(item(e[0]), s1);
            if (!(p.alarmLo < p.normLo && p.normLo < p.normHi && p.normHi < p.alarmHi && p.alarmHi < p.tripHi)) {
              bad.push(e[1] + ' ' + [p.tripLo, p.alarmLo, p.normLo, p.normHi, p.alarmHi, p.tripHi].join('/'));
            }
          });
          ck('units: SI band quantisation keeps every region distinguishable', bad.length === 0, bad.join(' · '));
          unitsMode = 'US'; RD.PwrBoard.render(s0);
        })();
      })();

      out.push('', nFail === 0 ? 'ALL ' + nPass + ' CHECKS PASS' : nFail + ' FAILURES / ' + (nPass + nFail));
      document.getElementById('out').innerHTML = out.join('\n');
      document.title = (nFail === 0 ? 'PASS ' : 'FAIL ') + '— PWR Board checks';
    }, 800);
  })();
  </script>
</body>
</html>
