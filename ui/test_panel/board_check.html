  <script>
  (function () {
    'use strict';
    var RD = globalThis.RD;
    var out = [], nPass = 0, nFail = 0;
    function ck(name, cond, detail) {

      if (cond) { nPass++; out.push('<span class="p">PASS</span> ' + name); }
      else { nFail++; out.push('<span class="f">FAIL</span> ' + name + (detail != null ? '  [' + detail + ']' : '')); }
    }

    var svc = new RD.SimulationService({ plant_id: 'pwr', initial_state: 'hot_full_power' });
    var snap = svc.assembleSnapshot();

    var sentCommands = [];
    // Display units. This harness runs the board in US — the mode every check below was
    // written against — and the SI block at the bottom flips it deliberately.
    //
    // It used to pass `unit: 'si'`, a STRING, which nothing has ever read: WIRING_REFERENCE
    // described a `ctx.unit` selector that was never built, and app.js passes a `unit(dim)`
    // FUNCTION under that name. So this harness claimed to be testing SI and rendered US
    // for its whole life. The real accessor is `units()` (#238).
    var unitsMode = 'US';
    var ctx = {
      cmd: function (c) { sentCommands.push(c); return (svc.command ? svc.command(c) : svc.handleCommand(c)); },
      units: function () { return unitsMode; },
      mode: function () { return 'learning'; },
      overlay: function () { return false; }
    };

    RD.PwrBoard.mount(document.getElementById('host'), ctx);
    RD.PwrBoard.render(snap);

    setTimeout(function () {
      RD.PwrBoard.rescanPorts();
      RD.PwrBoard.render(svc.assembleSnapshot());

      var stage = document.querySelector('.pwr-board-stage');
      ck('board mounts', RD.PwrBoard.isMounted());
      ck('stage present', !!stage);
      var missing = [];
      (window.RD_PWR_BOARD_DOC.items || []).forEach(function (it) {
        if (it.kind !== 'component') return;
        if (!(RD.BoardComps && RD.BoardComps[it.comp])) missing.push(it.comp);
      });
      ck('all component modules registered', missing.length === 0, missing.join(','));
      var tiles = stage ? stage.querySelectorAll('.bd-tile').length : 0;
      ck('all items rendered (' + tiles + ')', tiles === (window.RD_PWR_BOARD_DOC.items || []).length, tiles);
      var portCount = Object.keys(RD.PwrBoard.ports()).length;
      ck('ports scanned (' + portCount + ' >= 40)', portCount >= 40, portCount);
      var pipes = stage ? stage.querySelectorAll('svg > g').length : 0;
      ck('pipes + flanges drawn (' + pipes + ')', pipes >= (window.RD_PWR_BOARD_DOC.pipes || []).length, pipes);
      var pendingPorts = (window.RD_PWR_BOARD_DOC.pipes || []).filter(function (p) {
        var bad = 0;
        [p.from, p.to].forEach(function (e) {
          if (typeof e === 'string' && !RD.PwrBoard.ports()[e]) bad++;
        });
        return bad > 0;
      }).map(function (p) { return p.id; });
      ck('every pipe endpoint resolves', pendingPorts.length === 0, pendingPorts.join(','));

      // ---- geometry: joints that must run plumb (#231) -------------------------
      // The pressurizer's three centreline ports scanned 6 px LEFT of both fittings they
      // join, so the surge line and the PORV tap each ran out of plumb between two
      // horizontal flange bars — visible on the board as "the pressurizer sits a little
      // left". comp_pressurizer.js corrects it with a measured translateX; these pin the
      // RESULT rather than the offset, so a re-export that moves either tile fails here
      // instead of silently restoring the jog.
      (function () {
        var P = RD.PwrBoard.ports();
        function plumb(name, a, b, axis) {
          var pa = P[a], pb = P[b];
          if (!pa || !pb) { ck(name, false, 'missing port: ' + (pa ? b : a)); return; }
          var d = pa[axis] - pb[axis];
          ck(name + ' (' + axis + ' ' + pa[axis] + ' vs ' + pb[axis] + ')', Math.abs(d) <= 1, 'off by ' + d);
        }
        plumb('geom: pressurizer surge line plumb to the hot-leg tee', 'pressurizer/surge', 'ims2kt7fu64/c', 'x');
        plumb('geom: pressurizer PORV tap plumb to the block valve', 'pressurizer/pressure-tap', 'imrppb3kuav/b', 'x');
        plumb('geom: pressurizer relief nozzle on the vessel axis', 'pressurizer/relief-out', 'pressurizer/surge', 'x');
        plumb('geom: SG feed line level with the feed tee (#237)', 'steamGenerator/fw-in', 'ims31q71cmu/a', 'y');

        // --- 2026-08-03 owner board walk-round -------------------------------------
        // The spray stub. `pressurizer/spray-in` scanned at y=332 against a run whose
        // first waypoint is authored at y=335, so the 17 px stub leaned 3 px — 10°, and
        // the one segment of that run the eye reads against the vessel top. The
        // PRESSURIZER moved down 3 (DOC_PATCHES), which is why the three x-plumb pins
        // above must still pass: a pure Y shift cannot move them.
        //
        // Pinned against the WAYPOINT, not a literal, so re-routing the spray line in
        // the builder moves the expectation with it.
        (function () {
          var wp = null;
          (window.RD_PWR_BOARD_DOC.pipes || []).forEach(function (p) {
            if (p.id === 'pms3ytzwwqw' && p.waypoints && p.waypoints.length) wp = p.waypoints[0];
          });
          var pa = P['pressurizer/spray-in'];
          ck('geom: pressurizer spray stub runs level (y ' + (pa ? pa.y : '?') + ' vs waypoint ' + (wp ? wp[1] : '?') + ')',
            !!(pa && wp) && Math.abs(pa.y - wp[1]) <= 1, pa && wp ? 'off by ' + (pa.y - wp[1]) : 'missing');
        })();

        // ---- THE PRESSURIZER'S INSIDE (#473) --------------------------------------------
        // This harness pinned the vessel's PORTS and nothing about what is drawn inside it,
        // which is how the heater bank came to be drawn at level 19-27 % — ABOVE the 17 %
        // cutoff that exists because the bank uncovers. A bank that can never uncover is a
        // bank the level can never fall through, and no check could see it.
        //
        // THE EXPECTATION IS RETYPED, NOT IMPORTED. `yVol` below is an independent
        // implementation of the cavity integral from the design's own shell constants; if it
        // agreed with the component by sharing code it would agree with any component.
        (function () {
          var cavR = 50, dishB = 62, domeB = 45, yFloor = 541, yShellBot = 479, yShellTop = 151;
          var vDish = (2 / 3) * Math.PI * cavR * cavR * dishB;
          var vCyl = Math.PI * cavR * cavR * (yShellBot - yShellTop);
          var vDome = (2 / 3) * Math.PI * cavR * cavR * domeB;
          var vTot = vDish + vCyl + vDome;
          function cap(hh, b) { var s = hh / b - 1; return Math.PI * cavR * cavR * b * (s - s * s * s / 3 + 2 / 3); }
          function yVol(pct) {
            var V = Math.max(0, Math.min(100, pct)) / 100 * vTot, lo, hi, i, m;
            if (V <= vDish) {
              lo = 0; hi = dishB;
              for (i = 0; i < 40; i++) { m = (lo + hi) / 2; if (cap(m, dishB) < V) lo = m; else hi = m; }
              return yFloor - (lo + hi) / 2;
            }
            if (V <= vDish + vCyl) return yShellBot - (V - vDish) / (Math.PI * cavR * cavR);
            lo = 0; hi = domeB;
            for (i = 0; i < 40; i++) {
              m = (lo + hi) / 2;
              if (vDish + vCyl + (vDome - cap(domeB - m, domeB)) < V) lo = m; else hi = m;
            }
            return yShellTop - (lo + hi) / 2;
          }
          var comp = RD.BoardComps && RD.BoardComps.Pressurizer;
          if (!comp || !comp.build) { ck('art: pressurizer component available', false, 'not registered'); return; }
          // A DETACHED instance, driven directly — the mounted one is at whatever level the
          // plant happens to be at, and a mapping check needs to choose its own levels.
          var inst = comp.build({ id: 'chkPzr', comp: 'Pressurizer', showControls: false },
            { h: RD.BoardH.h, uid: RD.BoardH.uid, StdPipe: window.StdPipe, onControl: function () {} });
          // the ELEVATION lives in the v2 pressurizer block, the CUTOFF in the v1 one — two
          // blocks, one fact, which is why both are read by name here rather than assumed
          var CFGP = (RD.PWR_CONFIG && RD.PWR_CONFIG.pressurizer) || {};
          var CFGP2 = (RD.PWR_CONFIG && RD.PWR_CONFIG.pressurizer2) || {};
          var bandBot = CFGP2.heater_elev_bot_pct, bandTop = CFGP2.heater_elev_top_pct;
          inst.update({ level: 55, heaterElevPct: [bandBot, bandTop] });
          var water = inst.el.querySelector('[data-role="pzr-water"]');
          var rods = inst.el.querySelectorAll('[data-role="pzr-rod"]');
          // 1. THE MAPPING. A linear-in-height ramp — what this drew until #473 — differs by
          // up to 18 px at the low end and 10 px at the high-level trip, so the tolerance
          // discriminates between the two rather than merely admitting both.
          var worst = 0, worstAt = null, linWorst = 0;
          [0, 5, 15, 25, 50, 61.5, 87, 100].forEach(function (lv) {
            inst.update({ level: lv, heaterElevPct: [bandBot, bandTop] });
            var got = parseFloat(water.getAttribute('y'));
            var want = yVol(lv), lin = yFloor - (lv / 100) * (yFloor - 106);
            if (Math.abs(got - want) > worst) { worst = Math.abs(got - want); worstAt = lv; }
            if (Math.abs(lin - want) > linWorst) linWorst = Math.abs(lin - want);
          });
          ck('art: pressurizer water surface is placed by VOLUME, not by height (worst ' +
             worst.toFixed(2) + ' px at ' + worstAt + ' %)', worst < 0.6,
             'a linear height ramp would be ' + linWorst.toFixed(1) + ' px out at its worst');
          // 2. THE BANK IS INSIDE THE BAND THE PLANT PUBLISHES.
          inst.update({ level: 55, heaterElevPct: [bandBot, bandTop] });
          var yTopB = yVol(bandTop), yBotB = yVol(bandBot), outside = 0, poking = 0;
          Array.prototype.forEach.call(rods, function (r) {
            var ry = parseFloat(r.getAttribute('y')) + 2.4;
            if (ry < yTopB - 0.5 || ry > yBotB + 0.5) outside++;
            var x0 = parseFloat(r.getAttribute('x')), w = parseFloat(r.getAttribute('width'));
            var u = ry > yShellBot ? (ry - yShellBot) / dishB : ry < yShellTop ? (yShellTop - ry) / domeB : 0;
            var half = cavR * Math.sqrt(Math.max(0, 1 - Math.min(1, u) * Math.min(1, u)));
            if (x0 < 100 - half - 0.01 || x0 + w > 100 + half + 0.01) poking++;
          });
          ck('art: the heater bank is drawn INSIDE the elevation band the plant publishes (' +
             bandBot + '-' + bandTop + ' %, y ' + yTopB.toFixed(1) + '-' + yBotB.toFixed(1) + ')',
             rods.length === 4 && outside === 0, outside + ' of ' + rods.length + ' rods outside');
          ck('art: every heater rod stays inside the vessel cavity (the dished wall is curved)',
             poking === 0, poking + ' rod(s) drawn through the shell');
          // 3. THE DEFECT ITSELF, stated as the ordering it violated: the bank must sit BELOW
          // the level at which the plant cuts the heaters, or it is a bank that can never
          // uncover and the cutoff protects nothing.
          ck('art: the drawn bank sits BELOW the heater cutoff level (it was drawn 15.6-24.6 % ' +
             'against a 17 % cut)',
             isFinite(bandTop) && bandTop < CFGP.heater_cutoff_level_pct,
             'band top ' + bandTop + ' % vs cutoff ' + CFGP.heater_cutoff_level_pct + ' %');
          // 4. THE WIRED PATH, which the three checks above cannot see: they hand the band to a
          // DETACHED instance themselves. This reads the bank on the MOUNTED board, so a
          // `heaterElevPct` prop that never arrives is visible — the component's bare-mount
          // default is deliberately the old, wrong elevation for exactly this reason.
          var mounted = document.querySelector('[data-item="pressurizer"]');
          var mRods = mounted ? mounted.querySelectorAll('[data-role="pzr-rod"]') : [];
          var mOut = 0;
          Array.prototype.forEach.call(mRods, function (r) {
            var ry = parseFloat(r.getAttribute('y')) + 2.4;
            if (ry < yTopB - 0.5 || ry > yBotB + 0.5) mOut++;
          });
          ck('art: the MOUNTED board draws the bank at the band too — the prop really arrives',
             mRods.length === 4 && mOut === 0,
             mRods.length + ' rods on the board, ' + mOut + ' outside ' + yTopB.toFixed(1) +
             '-' + yBotB.toFixed(1) + ' (a dropped prop leaves them at the pre-#473 elevation)');
        })();
        // The condensate train's three drops. Only the FIRST was ever crooked (1527 vs
        // 1525) — the other two were already plumb, so this pins all three or a "fix" that
        // straightens one by bending the others goes unnoticed. The condenser is what
        // moved: `Pump` is in NUDGE_KINDS, so pump flange faces snap to the 5 px doc grid
        // and can never land on 1527.
        // Still a plumb drop after the 2026-08-05 re-export: the owner moved the condensate
        // train 210 px left AND the condenser with it, so the pair stayed together and only
        // the same 2 px lean the CONDENSER item patch has always corrected was left over.
        plumb('geom: condenser drop into the condensate pump', 'condenser/condensate-out', 'imrqvzbd9hd/suction', 'x');
        plumb('geom: condensate pump up to the polisher', 'imrqvzbd9hd/discharge', 'imrqrnclhn/~ptmrqteexd9e', 'x');
        plumb('geom: polisher down to the feed pump', 'imrqrnclhn/~ptmrqted2hiw', 'imrobph7xrq/suction', 'x');
        // The turbine exhaust run. BOTH waypoints are pinned in DOC_PATCHES.pipes, one to
        // each end's port, so BOTH need a pin here — moving either tile drags its port and
        // the corresponding riser leans.
        //
        // Only the condenser end was pinned until 2026-08-06, and that gap is what let the
        // defect ship: the #371b re-export moved the turbine 210 px left / 40 px up, the
        // fix-up patched wp[1] and forgot wp[0], and the first waypoint sat inside the
        // TURBINE-GENERATOR card for a day with every gate green. A one-sided pin on a
        // two-ended run is not coverage. `pwr_board_wiring.js`'s selfTest cannot substitute:
        // it asserts a patch's target id still RESOLVES, never that its numbers still mean
        // anything, and no overlap scan anywhere looks at pipes-over-cards.
        (function () {
          var wp = null;
          (window.RD_PWR_BOARD_DOC.pipes || []).forEach(function (p) {
            if (p.id === 'pmrr14xbt2h' && p.waypoints && p.waypoints.length >= 2) wp = p.waypoints;
          });
          var pt = P['turbineGenerator/exhaust-out'], pc = P['condenser/steam-in'];
          ck('geom: turbine exhaust riser plumb out of the turbine (x ' + (pt ? pt.x : '?') + ' vs waypoint ' + (wp ? wp[0][0] : '?') + ')',
            !!(pt && wp) && Math.abs(pt.x - wp[0][0]) <= 1, pt && wp ? 'off by ' + (pt.x - wp[0][0]) : 'missing');
          ck('geom: turbine exhaust riser plumb into the condenser (x ' + (pc ? pc.x : '?') + ' vs waypoint ' + (wp ? wp[1][0] : '?') + ')',
            !!(pc && wp) && Math.abs(pc.x - wp[1][0]) <= 1, pc && wp ? 'off by ' + (pc.x - wp[1][0]) : 'missing');
          // …and the crossover leg between them must clear both tiles, or the run is drawn
          // THROUGH the turbine card or the condenser body. This is the check that actually
          // describes the reported symptom; the two plumb pins above would both pass on a
          // run at any y.
          var doc = window.RD_PWR_BOARD_DOC, tg = null, cd = null;
          (doc.items || []).forEach(function (it) {
            if (it.id === 'turbineGenerator') tg = it;
            if (it.id === 'condenser') cd = it;
          });
          var lo = tg ? tg.top + tg.height : null, hi = cd ? cd.top : null;
          ck('geom: turbine exhaust crossover clears both tiles (y ' + (wp ? wp[0][1] : '?') + ' in ' + lo + '..' + hi + ')',
            !!(wp && lo != null && hi != null) && wp[0][1] === wp[1][1] && wp[0][1] > lo && wp[0][1] < hi,
            wp ? 'y=' + wp[0][1] + '/' + wp[1][1] : 'missing');
        })();
      })();

      // ---- geometry: a card TITLE is not an item, and the overlap pin cannot see it ----
      // The bdDtMargin readout was printing on top of 'NUCLEAR INSTRUMENTATION (NIS)'
      // (owner, 2026-08-03). It survived the #311 geometry pins because those skip `box`
      // and `component` kinds — a readout deliberately sits INSIDE its card — and a card
      // title is rendered as a `.bd-box-title` CHILD of the box, so the one element it
      // could collide with was the one element the ruler was told to ignore.
      //
      // Measured, not arithmetic: the #311 comment put the title's end at authored x≈905
      // when it ran to x≈989, an 84 px error, which is exactly the class of mistake a
      // rendered-rect check exists to catch. Every rAnchor status word in a card corner
      // gets a pin here, not just the one that failed.
      (function () {
        var stg = document.querySelector('.pwr-board-stage');
        function noTitleOverlap(name, itemId, cardId) {
          var v = stg && stg.querySelector('[data-item="' + itemId + '"]');
          var t = stg && stg.querySelector('[data-item="' + cardId + '"] .bd-box-title');
          if (!v || !t) { ck(name, false, 'missing ' + (v ? cardId + ' title' : itemId)); return; }
          var a = v.getBoundingClientRect(), b = t.getBoundingClientRect();
          var gap = a.left - b.right;
          var clear = gap > 0 || a.right < b.left || a.bottom <= b.top || a.top >= b.bottom;
          ck(name + ' (gap ' + gap.toFixed(1) + ' px)', clear, 'overlaps by ' + (-gap).toFixed(1));
        }
        noTitleOverlap('geom: core ΔT margin clears the NIS card title', 'bdDtMargin', 'ims175lciah');
        // (There was a third: bdRodStatus against the ROD CONTROL title. The ROD status word
        //  itself was removed on the develop lane *(OWNER DIRECTIVE, 2026-08-03: "the new rod
        //  control indication that says 'manual', 'in', 'out, is redundant. when in rod auto
        //  the withdraw or insert buttons glow amber when its automatically moving the rods.
        //  remove it")*, and the two changes met at the 2026-08-04 merge. The pin is DELETED,
        //  not made tolerant of a missing element: a clearance check whose subject no longer
        //  exists would pass forever and assert nothing, which is the vacuous shape this file
        //  keeps finding. It failed loudly at the merge, which is what a pin is for.)
        noTitleOverlap('geom: feed status clears the SG FEED title', 'ims89lnqmip', 'imrqxsodu5j');
        // The gap has to survive the WIDEST value the field can print, not the one that
        // happens to be on screen. `dtMargin` renders `name + ' ' + margin.toFixed(1)` over
        // a [-500, 1500] instrument, so 11 characters is the bound. Measured on a CLONE —
        // writing textContent on a live board value destroys the child nodes the renderer
        // updates, and every later sample then lies.
        (function () {
          var v = stg && stg.querySelector('[data-item="bdDtMargin"]');
          var t = stg && stg.querySelector('[data-item="ims175lciah"] .bd-box-title');
          if (!v || !t) { ck('geom: core ΔT margin clears the title at full width', false, 'missing element'); return; }
          var live = v.getBoundingClientRect(), c = v.cloneNode(true);
          var span = c.querySelector('span') || c;
          var was = span.textContent;
          span.textContent = 'OPΔT 8.3'; c.style.visibility = 'hidden'; c.style.position = 'static';
          v.parentNode.appendChild(c);
          var base = c.getBoundingClientRect().width;
          span.textContent = 'OTΔT -125.4';
          var wide = c.getBoundingClientRect().width;
          c.parentNode.removeChild(c); span.textContent = was;
          var leftAtWidest = live.right - (live.width + (wide - base));
          var gap = leftAtWidest - t.getBoundingClientRect().right;
          ck('geom: core ΔT margin clears the title at full width (gap ' + gap.toFixed(1) + ' px)', gap > 0, 'overlaps by ' + (-gap).toFixed(1));
        })();
      })();

      if (RD.PwrBoardDriver && RD.PwrBoardDriver.selfTest) {
        RD.PwrBoardDriver.selfTest(ck, svc, sentCommands);
      }

      // ---- functional: click real board controls, confirm the engine responds ----
      function clickBtn(id) { var b = document.querySelector('[data-item="' + id + '"] button'); if (b) b.click(); return !!b; }

        // is the whole point of keeping min/max — read `verts('polyline,polygon')` for

        //    excursion between two sampled indices simply disappears — from a VITAL
        //    gauge. Bucketing keeps each bucket's min/max, so it cannot.
        fresh();

        for (var i = 0; i < 700; i++) { t += 0.2; push(t, 2235); }

        //    tries. The first version fed a ±0.4 psi wobble and passed on BOTH forms,

      // --- Generator FOLLOW / MAN / OFF: a planned offline is NOT a turbine trip (#230) ---

      // This block does NOT get an at-power plant: the RCP OFF click near the top of the
      // functional section stops the pumps at full power, which scrams the reactor and

      // Trip-provenance shim (#418 A1 — LOAD-BEARING, not just diagnostic): record every

      // PATH — `disconnect_grid` must not trip the turbine — and this harness's plant

      var _tripLog = [];

              + ',sglvl=' + ins.sg_level.toFixed(1) + ',sgP=' + eng.s.steam_pressure_mpa.toFixed(2) + ')');
          }

      var _freshScram = _tripLog.some(function (e) { return e.indexOf('scram@') === 0; });
      ck('func: a PLANNED offline does NOT trip the turbine (#230)',
        g1.instruments.turbine_tripped === false || _freshScram,

        + ' tripLog=[' + (_tripLog.join(' ') || 'empty') + ']');

      ck('feedback: LATCH tile lit while off line — a planned offline does not un-latch',

      ck('feedback: LATCH tile lit back on line', tileActive('imro8ktzs3u'));

      function pipeState(id) { return RD.PwrBoard.pipeFlowState(id); }

      ck('pipe: post-scram steam dump line RUNNING (dump carries decay heat)',

      RD.PwrBoard.render(svcHfp.assembleSnapshot());

        pipeState('pms3tda86bw') === 'paused', pipeState('pms3tda86bw'));
      ck('pipe: full power steam dump branch PAUSED (dump shut at power)',

      // The RWST → charging-pump-suction cross-tie, out of the ECCS panel's RIGHT side.

      // the ECCS is off or not flowing" — and it did, in EVERY state of the plant, because

      // rather than on the ECCS train.
      //
      // The other endpoint is a plain BOX port, which carries no `data-active` at all, so
      // `portActive` returns true for it unconditionally and the tee leg is this pipe's
      // only gate. That is why the sibling checks matter: the two normal CVCS suction
      // lines must stay RUNNING through the fix, or "stop the lie" has just stopped the

      //
      // BOTH states are asserted, on their OWN services, and both need stepping — the
      // whole block restores the svcHfp render on the way out so the units section below

      //   · CVCS: t=0 instruments have not converged, so `charging_flow` reads exactly 0
      //     and every gate reading it is off. 20 cycles is 2 plant-seconds.
      //   · ECCS: a LOCA, not a bare `set_hpi active:true`, and that is physics rather

      //     large LOCA: HPI arms at ~8 s / 12.1 MPa and flow reaches 0.198 by 20 s. The
      //     first draft used set_hpi and read the resulting dead pipe as a defect.
      (function () {
        var svcCvcs = new RD.SimulationService({ plant_id: 'pwr', initial_state: 'hot_full_power' });
        svcCvcs.running = true; for (var k = 0; k < 20; k++) svcCvcs.tick(); svcCvcs.running = false;

        svcEccs.handleCommand({ action: 'inject_failure', failure_id: 'large_loca', severity: 0.2 });
        svcEccs.running = true; for (var i = 0; i < 200; i++) svcEccs.tick(); svcEccs.running = false;
        var sn = svcEccs.assembleSnapshot();
        RD.PwrBoard.render(sn);
        var f = (sn.instruments.hpi_flow || 0).toFixed(3);
        ck('pipe: ECCS injecting -> RWST->charging cross-tie RUNNING (hpi_flow ' + f + ')',
          pipeState('pms3xe4ia7n') === 'running', pipeState('pms3xe4ia7n'));
        ck('pipe: ECCS injecting -> RWST->ECCS pump suction RUNNING (hpi_flow ' + f + ')',
          pipeState('pms3x1rbkod') === 'running', pipeState('pms3x1rbkod'));
        RD.PwrBoard.render(svcHfp.assembleSnapshot());

        ck('readout: PZR TEMP reads saturation (600-700 F at power)', tv > 600 && tv < 700, tt && tt.textContent);
        var ht = document.querySelector('[data-item="ims5gprvl7n"]');
        ck('readout: PZR HTR PWR live indication numeric', !!ht && /\d/.test(ht.textContent), ht && ht.textContent);
      })();

      // ---- #350: the two new indications, and the flow states that are the point --------
      // These are pinned rather than trusted for the reason CLAUDE.md gives about rAnchor
      // geometry: the FIRST placement of the spray readout was authored under the spray demand
      // box on the arithmetic that a number tile is ~26 px tall. It renders 47 px (it carries
      // ▲▼ arrows), so it overlapped by 80x20 px and BOTH elements still rendered. Only a ruler
      // finds that, and only a pin keeps it found.
      (function () {
        function tileRect(id) {
          var el = document.querySelector('[data-item="' + id + '"]');
          if (!el) return null;
          var t = el.closest('.bd-tile') || el, st = document.querySelector('.pwr-board-stage');
          var r = t.getBoundingClientRect(), sr = st.getBoundingClientRect();
          var sc = sr.width / (st.offsetWidth || 1);
          return { l: (r.left - sr.left) / sc, t: (r.top - sr.top) / sc,
                   r: (r.right - sr.left) / sc, b: (r.bottom - sr.top) / sc, el: t };
        }
        function overlaps(a, b) {
          if (!a || !b) return false;
          return Math.min(a.r, b.r) - Math.max(a.l, b.l) > 0.5 &&

        ['ims5gp0aicx', 'ims5gq44zgr', 'ims5gpdv96m', 'ims5gprvl7n', 'imro929i738',
         'imro901sddd', 'imrsg8b7b9o'].forEach(function (id) {

        ['imrsjy1m9g', 'imrsjy59pnu', 'imsgti1p0rm', 'imsgti0gnpf'].forEach(function (id) {
          if (overlaps(rf, tileRect(id))) hits.push('rcpflow x ' + id);
        });
        ck('geometry: the two new readouts overlap nothing', hits.length === 0, hits.join(', '));
        // REACTIVITY is GONE and PERIOD took its slot (item 5). Asserted positively both ways:
        // a missing-item check alone would pass if PERIOD had simply been deleted too.
        ck('item 5: the REACTIVITY readout is removed from the board',
           !document.querySelector('[data-item="imro6rdwwdn"]') &&
           !document.querySelector('[data-item="imrshokxy4u"]'));
        // RE-POINTED at #591 item 3, and it now asserts the thing that actually went wrong.
        // #350 item 5 pinned PERIOD's caption at "top ~455": a POSITION, not a claim, and a

        var pl = tileRect('ims89mc0hl3'), pv = tileRect('ims89mkaj2r'), pc = tileRect('bdReactivityCard');

           pl.l >= pc.l - 1 && pv.r <= pc.r + 1 &&

        ck('pipe: blackout -> primary loop STILL CRAWLS on natural circulation (rcs_flow ' + f + ' %)',
           RD.PwrBoard.pipeFlowState('pms2ktjq4ma') === 'running', RD.PwrBoard.pipeFlowState('pms2ktjq4ma'));
        // The RCP's OWN runs, and this is the check that discriminates the mechanism rather
        // than the wiring: the pump art correctly reads STOPPED and pulls both its ports down,
        // so these two pipes are only running because the driver's measured-flow verdict
        // REPLACES the port gate instead of being ANDed with it. Injection-verified — restore
        // the AND and these two go paused while the tee-to-SG run above stays green.
        ck('pipe: blackout -> RCP discharge run crawls (driver verdict beats the port gate)',
           RD.PwrBoard.pipeFlowState('pms2kozvu94') === 'running', RD.PwrBoard.pipeFlowState('pms2kozvu94'));
        ck('pipe: blackout -> RCP suction run crawls',
           RD.PwrBoard.pipeFlowState('pms2kp1148p') === 'running', RD.PwrBoard.pipeFlowState('pms2kp1148p'));
        ck('pipe: blackout -> circulating water PAUSED (item 14)',
           RD.PwrBoard.pipeFlowState('pms3l83etan') === 'paused', RD.PwrBoard.pipeFlowState('pms3l83etan'));
        ck('pipe: blackout -> feed tee to SG PAUSED (item 9: no main feed, no AFW)',
           RD.PwrBoard.pipeFlowState('pms31qjbqhy') === 'paused', RD.PwrBoard.pipeFlowState('pms31qjbqhy'));
        // #358: at 120 s of blackout the feed channel is engaged, NOT yet saturated (the
        // windup reaches its 120 % rail near ~600 s), and commanding ~27 % at a plant
        // delivering ~1e-51 — the exact state that used to render a green HOLDING corner
        // and a climbing cyan gpm box. Injection-verified: blank feedNoFlow's flow term
        // and both of these go back to lying.
        (function () {
          var st = document.querySelector('[data-item="ims89lnqmip"]');
          ck('func: blackout -> SG FEED corner reads NO FLOW in the pre-SAT window (#358)',
             !!st && /NO FLOW/.test(st.textContent), st ? st.textContent : 'tile missing');
          var ni = document.querySelector('[data-item="imro8xhy2me"] input');
          var nc = ni ? ni.style.color : 'input missing';
          ck('func: blackout -> the gpm demand box is marked amber — commanded, not delivered (#358)',
             nc === 'rgb(216, 166, 87)' || nc === '#d8a657', nc);

          sentCommands.length = 0;
          setNum('imrsg8b7b9o', 2235);
          var c2 = sentCommands.filter(function (x) { return x.action === 'set_pressure_setpoint'; }).pop();
          ck('units: the SAME box typed in psi is still commanded in MPa', !!c2 && Math.abs(c2.mpa - 15.41) < 0.01, c2 && c2.mpa);
        })();

        // --- back to US: the authored board must return EXACTLY, every tile.
        // This is the check that catches a one-way conversion — a unit span overwritten
        // with 'MPa' and never restored looks fine until someone switches back.
        svc.command ? svc.command({ action: 'set_pressure_setpoint', mpa: 15.41 })
                    : svc.handleCommand({ action: 'set_pressure_setpoint', mpa: 15.41 });
        unitsMode = 'US'; RD.PwrBoard.render(s0);
        (function () {
          var after = snapAll(), diff = [];
          Object.keys(beforeUS).forEach(function (k) { if (beforeUS[k] !== after[k]) diff.push(k); });
          ck('units: SI -> US restores the authored board exactly (' + Object.keys(beforeUS).length + ' items)',
            diff.length === 0, diff.slice(0, 6).join(','));
          ck('units: SI -> US restores every vital tile band and unit',
            tileProps(s0) === beforeTiles, 'tile props differ');
        })();

        // Band QUANTISATION has to be per-unit, and this is the check that says so. Band
        // edges are rounded to stop the tile strip flickering at the render rate, and the
        // quantum used to be a whole display unit — fine at 1 psi, catastrophic at 1 MPa,
        // which is 145 of them: the pressurizer's 15.20-15.76 control band and its
        // 14.82/15.86 alarms all collapse onto 15 and 16, and the seven regions the tile
        // paints stop being distinguishable. Assert the nesting survives, in BOTH families
        // that quantise (pressure at 0.01 MPa, temperature at 0.5 °C) — a tile whose normal
        // band has merged into its alarm band is telling the operator nothing.
        (function () {
          // On a FRESH hot_full_power plant, not the one the checks above have driven
          // around: by this point the pressure setpoint has been moved and the normal band
          // legitimately clamps onto its own alarm, which is #270's guard doing its job and
          // not a resolution defect. The claim here is about the design case.
          //
          // It runs AFTER the restore checks and re-asserts SI for itself, on purpose and in
          // that order: assembling a foreign snapshot walks the driver's one-entry damping
          // memo (IN()), so doing this mid-sequence perturbed the very tile values the
          // restore comparison was about to check. Both halves of that are easy to get
          // wrong — an SI check that silently ran in US measured nothing at all.
          var s1 = new RD.SimulationService({ plant_id: 'pwr', initial_state: 'hot_full_power' }).assembleSnapshot();
          unitsMode = 'SI';
          var bad = [];
          [['ims2immsvn6', 'pressure'], ['ims2immk7ks', 'Tavg']].forEach(function (e) {
            var p = d.compProps(item(e[0]), s1);
            if (!(p.alarmLo < p.normLo && p.normLo < p.normHi && p.normHi < p.alarmHi && p.alarmHi < p.tripHi)) {
              bad.push(e[1] + ' ' + [p.tripLo, p.alarmLo, p.normLo, p.normHi, p.alarmHi, p.tripHi].join('/'));
            }
          });
          ck('units: SI band quantisation keeps every region distinguishable', bad.length === 0, bad.join(' · '));
          unitsMode = 'US'; RD.PwrBoard.render(s0);
        })();
      })();

      out.push('', nFail === 0 ? 'ALL ' + nPass + ' CHECKS PASS' : nFail + ' FAILURES / ' + (nPass + nFail));
      document.getElementById('out').innerHTML = out.join('\n');
      document.title = (nFail === 0 ? 'PASS ' : 'FAIL ') + '— PWR Board checks';
    }, 800);
  })();
  </script>
</body>
</html>
