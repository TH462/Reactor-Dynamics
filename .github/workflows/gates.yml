# The aggregate gate, run on every push and pull request.
#
# `node test/run_all.js` runs all 38 runners and compares each against the BASELINES
# map at the top of that file. Drift is symmetric — a runner scoring BETTER than its
# baseline fails too, so a red turning green has to be acknowledged rather than
# silently absorbed.
#
# THERE IS STILL NO package.json, AND THERE MUST NOT BE ONE. FOUR runners
# (verify_flags_ui, verify_e2e_ui, verify_manual_follow, verify_board_check)
# `require('playwright')`,
# which is why the first version of this workflow — `--fast`, no install — was red on
# every single run from 2026-07-27 to 2026-07-31: --fast only skips the two gates
# carrying `slow: true`, and verify_flags_ui is not one of them (it takes 8 s, so
# calling it slow would be a lie), and neither is verify_board_check, which takes 2 s
# and exists precisely so its count cannot drift unnoticed in a --fast run. #191 was
# filed believing a browser in CI required
# conceding a manifest. It does not: npm installs into a scratch --prefix outside the
# checkout, and the result is copied to ./node_modules — which is gitignored, and is
# exactly how the local trees are already arranged (playwright is vendored there, not
# declared). The repo root stays manifest-free.
#
# Keep PW_VERSION equal to the version vendored in the local trees, or CI and the
# owner's machine are running different browsers. Check with:
#   node -e "console.log(require('./node_modules/playwright/package.json').version)"

name: gates

on:
  push:
    # main and develop ONLY *(OWNER DIRECTIVE, 2026-07-31: "I don't want the workbench or
    # backshop trees pushed to gh. Gh should only have main and develop.")*. The lanes are
    # local worktrees — scratch space so a second and third agent have somewhere to work —
    # and the repo is public, so publishing them puts work-in-progress on display for no
    # benefit now that the machine is backed up off-site.
    #
    # This briefly listed workbench/backshop (2026-07-31, #191) so a lane could be gated
    # before merging. That is given up deliberately, and it costs something real: a change
    # to THIS FILE can now only be proven by landing it on develop, which is exactly how
    # the --fast version shipped broken and stayed red for 32 runs. If you need to prove a
    # CI change again, push the lane temporarily, add it here, and delete both afterwards —
    # the Pages project excludes those branch names, so a temporary push cannot spring a
    # preview site on the owner the way it did the first time. (That guard used to live in
    # vercel.json, deleted with the Vercel integration — #413. It is now a project setting,
    # i.e. NOT visible in the repo: check the Pages dashboard before relying on it.)
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# ONE GATE RUN AT A TIME PER COMMIT (#496, 2026-08-19).
#
# A release PR is `develop -> main`, so a release commit fires BOTH triggers above: the push to
# `develop` and the pull_request. Same SHA, two jobs, seconds apart, each running the full
# 10-way-parallel `run_all` on one runner. They starve each other. Measured on PR #495:
#
#     pull_request              15m26s   pass
#     push, same SHA, alongside 25m17s   FAIL — "exceeded the maximum execution time of 25m0s"
#     push, same SHA, re-run alone       8m16s    pass
#
# PR #493 ran the same pair at 11m21s and 14m37s and both passed, which is the same race
# finishing under the cap by luck. A gate that passes or fails on runner luck is not reporting
# on the code — and the remedy for the red was "notice the other check passed and press re-run",
# which is the judgement a status check exists to remove.
#
# QUEUE, DO NOT CANCEL. `cancel-in-progress: true` would trade a timeout for a cancellation and
# a cancelled run still reports as a failed check; the ruleset on `main` wants the pull_request
# status and `develop` pushes want the other, so both must finish. Queue time does not count
# against `timeout-minutes`, which is why 25 stays as it is.
#
# THE KEY IS THE HEAD SHA, NOT `github.sha`. On a pull_request event `github.sha` is the
# EPHEMERAL MERGE COMMIT (`refs/pull/N/merge`), not the commit being tested — so grouping on it
# would put the two runs in different groups and serialise nothing, while looking exactly like a
# working fix. `github.event.pull_request.head.sha` is null on a push, hence the fallback.
concurrency:
  group: gates-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PW_VERSION: 1.61.1

jobs:
  aggregate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ACTION MAJORS ARE ON THE NODE 24 RUNTIME (#389, 2026-08-06). All four were on `@v4`,
      # which declares `using: node20` — deprecated, and the runner was force-running them on
      # Node 24 while printing a warning on every run. A warning is not a gate: nothing here
      # goes red, so the only signal was the raw CI log. This repo has already lost CI silently
      # once (32 consecutive red runs through a release to `main`), so it is fixed now rather
      # than when the forcing stops.
      #
      # The majors differ per action and are NOT all v5 — checked, not recalled: checkout v7,
      # setup-node v7, cache v6, upload-artifact v7 are the latest, and each declares
      # `using: node24`. Pinned to the MOVING major tag, matching what this file already did.
      # None of the breaking changes touch this workflow: checkout takes no inputs at all and
      # its v7 fork-PR block is scoped to `pull_request_target`/`workflow_run`, which this file
      # does not use; upload-artifact v7's `archive` is opt-in and defaults to the old
      # behaviour; the rest is ESM migration. Re-check `runs.using` when bumping again.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Browser binaries are ~150 MB and version-pinned; restoring them turns a
      # ~60 s download into a few seconds. A miss just downloads, so this is never
      # load-bearing for correctness.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ env.PW_VERSION }}

      - name: Vendor playwright into ./node_modules (no manifest in the repo)
        run: |
          # cd in a subshell, NOT `npm --prefix`: npm init honours --prefix
          # inconsistently across versions, and the version that ignores it writes
          # package.json into the repo root — the one outcome this must never have.
          mkdir -p "$RUNNER_TEMP/pw"
          ( cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && \
            npm install --no-audit --no-fund "playwright@$PW_VERSION" )
          cp -r "$RUNNER_TEMP/pw/node_modules" ./node_modules
          npx playwright install --with-deps chromium

      # node_modules/ is gitignored, so the checkout must still be clean here. If it
      # is not, the install leaked a manifest or a lockfile into the repo root and the
      # "no package.json" property this project holds has quietly been given up.
      - name: Assert the checkout is still manifest-free
        run: |
          test ! -f package.json || { echo "::error::a package.json appeared in the repo root"; exit 1; }
          test ! -f package-lock.json || { echo "::error::a package-lock.json appeared in the repo root"; exit 1; }
          git status --porcelain

      - name: Aggregate gate (all runners)
        run: node test/run_all.js

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-reports
          path: Diagnostic/
          if-no-files-found: ignore
          retention-days: 14
