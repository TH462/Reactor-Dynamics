# The aggregate gate, run on every push and pull request.
#
# `node test/run_all.js` runs every discovered runner (~90 — the count grows; the map is
# the authority, this comment said "38" while the suite stood at 89) and compares each
# against the BASELINES map at the top of that file. Drift is symmetric — a runner scoring
# BETTER than its baseline fails too, so a red turning green has to be acknowledged rather
# than silently absorbed.
#
# IT RUNS AS A 3-WAY MATRIX (#637, 2026-09-05), AND THE ARITHMETIC IS THE WHOLE ARGUMENT.
# From the green #630 run's own per-runner timings: 106 runners cost 5189 s of CPU; this
# runner class has FOUR cores, so run_all's pool is 3-way (min(10, cores - 1)); 5189 / 3 =
# 1730 s = 28.8 min against an observed step of 29.1 min. Throughput-bound to 1 %. The wall
# here is TOTAL CPU ÷ LANES, not the longest runner — which is why every timeout raise in
# the history below bought the same shrinking margin and nothing else. Each matrix job gets
# its OWN 4-core runner and the repo is public (standard runners are free), so three shards
# are ~9 lanes for no money. The floor then becomes the longest single runner —
# run_pwr2_engine, 1388 s green and 2094.6 s on the red release run — which is why splitting
# THAT is the other half of #637 and why the step budget below is still generous.
#
# THE JOB IDS ARE LOAD-BEARING. `main`'s branch ruleset (id 20067220) requires a status check
# whose context is exactly `aggregate-gate`; a matrix job reports as `aggregate-gate (1)`,
# `(2)`, `(3)`, so if the SHARDS carried that id the required context would never be reported
# and every release pull request would sit blocked for ever with three green checks on it.
# Hence: shards run under `gate-shard`, and a fan-in job whose id is exactly `aggregate-gate`
# reports the verdict. test/run_ci_shards.js asserts all of it statically, because a workflow
# file can only otherwise be proven by pushing it (see the branches note below).
#
# NODE_COMPILE_CACHE (#513): run_all sets a shared V8 code-cache dir (os.tmpdir()) in every
# child's env, so the 90 runners share compiles WITHIN a run. Deliberately NOT persisted
# across CI runs via actions/cache — the cross-run win is a few seconds of first-compiles
# against added restore latency and one more moving part in a workflow that has been burned
# twice (the --fast red streak; the vendoring stalls below).
#
# THERE IS STILL NO package.json, AND THERE MUST NOT BE ONE. FOUR runners
# (verify_flags_ui, verify_e2e_ui, verify_manual_follow, verify_board_check)
# `require('playwright')`,
# which is why the first version of this workflow — `--fast`, no install — was red on
# every single run from 2026-07-27 to 2026-07-31: --fast only skips the two gates
# carrying `slow: true`, and verify_flags_ui is not one of them (it takes 8 s, so
# calling it slow would be a lie), and neither is verify_board_check, which takes 2 s
# and exists precisely so its count cannot drift unnoticed in a --fast run. #191 was
# filed believing a browser in CI required
# conceding a manifest. It does not: npm installs into a scratch --prefix outside the
# checkout, and the result is copied to ./node_modules — which is gitignored, and is
# exactly how the local trees are already arranged (playwright is vendored there, not
# declared). The repo root stays manifest-free.
#
# Keep PW_VERSION equal to the version vendored in the local trees, or CI and the
# owner's machine are running different browsers. Check with:
#   node -e "console.log(require('./node_modules/playwright/package.json').version)"

name: gates

on:
  push:
    # main and develop ONLY *(OWNER DIRECTIVE, 2026-07-31: "I don't want the workbench or
    # backshop trees pushed to gh. Gh should only have main and develop.")*. The lanes are
    # local worktrees — scratch space so a second and third agent have somewhere to work —
    # and the repo is public, so publishing them puts work-in-progress on display for no
    # benefit now that the machine is backed up off-site.
    #
    # This briefly listed workbench/backshop (2026-07-31, #191) so a lane could be gated
    # before merging. That is given up deliberately, and it costs something real: a change
    # to THIS FILE can now only be proven by landing it on develop, which is exactly how
    # the --fast version shipped broken and stayed red for 32 runs. If you need to prove a
    # CI change again, push the lane temporarily, add it here, and delete both afterwards —
    # the Pages project excludes those branch names, so a temporary push cannot spring a
    # preview site on the owner the way it did the first time. (That guard used to live in
    # vercel.json, deleted with the Vercel integration — #413. It is now a project setting,
    # i.e. NOT visible in the repo: check the Pages dashboard before relying on it.)
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# THE 25-MINUTE TIMEOUTS WERE THE VENDORING STEP, NOT CONTENTION (#496, corrected 2026-08-19).
#
# This file briefly carried a `concurrency:` group serialising the two runs a release commit
# fires (the push to `develop` and the pull_request, same SHA). IT WAS REVERTED THE SAME DAY,
# and the reasoning that produced it is kept here because the mistake is more useful than the
# change was.
#
# The diagnosis was built from run DURATIONS — 15m26s pass beside a 25m17s timeout, 8m16s on a
# solo re-run — and never opened the STEP timings. They say something else entirely. On PR
# #495's failing run, attempt 1:
#
#     step 5  vendor playwright   12:20:50 -> 12:38:36   17m46s
#     step 7  aggregate gate      12:38:36 -> cancelled   7m19s of a ~13 min job
#
# `npm install` ate the budget; the gate was never slow and was never starved. Two later runs
# hung in the same step for the FULL 25 minutes and were cancelled before the gate ran at all.
# Measured across one day, that step ran 13 s, 13 s, 15 s, 1m24s, 1m34s, 17m46s, 24m55s,
# 25m07s — a 115x spread on a step whose healthy cost is under two minutes.
#
# And the contention premise was wrong on its face: each workflow run gets its OWN hosted runner,
# so they never shared a CPU. The two runs at 12:58:46 and 12:59:00 overlapped completely, before
# any concurrency group existed, and their gate steps took 14m53s and 12m36s — indistinguishable
# from the serialised pair later cited as proof the group had fixed something. The group bought
# nothing and cost every release ~15 minutes of added wall time waiting its turn.
#
# THE REAL FIX IS A STEP BUDGET. `timeout-minutes` on the job can only ever say "the job was too
# slow", which is what made a registry stall read as a slow test suite. Per-step budgets name the
# step, and they fail in minutes instead of consuming the whole job.

env:
  PW_VERSION: 1.61.1

jobs:
  # THE SHARDS. Any id EXCEPT `aggregate-gate` — see the header note; that name belongs to the
  # fan-in job below and to nothing else.
  gate-shard:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false, or the first shard to go red CANCELS the other two and the log stops
      # saying whether the rest of the suite was green. A gate exists to report, and a cancelled
      # shard also reports `cancelled` to the fan-in, which is indistinguishable from an
      # infrastructure kill.
      fail-fast: false
      matrix:
        # N lives HERE and in the --shard argument below, and nowhere else. run_ci_shards.js
        # asserts the two agree; do not introduce a third copy.
        shard: [1, 2, 3]
    # 45 -> 35 (#637 Phase E, same day): the tail runner is split — see the step note.
    # 60 -> 45 (#637, 2026-09-05): a shard is a third of the suite, but the un-split tail runner
    # (run_pwr2_engine, 23-35 min depending on the runner class) can still land in one of them,
    # so the budget is set for the TAIL and not for the third. Re-budget after #637 Phase E
    # splits that runner: measured per-shard wall x the 1.51 runner-class spread + margin.
    timeout-minutes: 35

    steps:
      # ACTION MAJORS ARE ON THE NODE 24 RUNTIME (#389, 2026-08-06). All four were on `@v4`,
      # which declares `using: node20` — deprecated, and the runner was force-running them on
      # Node 24 while printing a warning on every run. A warning is not a gate: nothing here
      # goes red, so the only signal was the raw CI log. This repo has already lost CI silently
      # once (32 consecutive red runs through a release to `main`), so it is fixed now rather
      # than when the forcing stops.
      #
      # The majors differ per action and are NOT all v5 — checked, not recalled: checkout v7,
      # setup-node v7, cache v6, upload-artifact v7 are the latest, and each declares
      # `using: node24`. Pinned to the MOVING major tag, matching what this file already did.
      # None of the breaking changes touch this workflow: checkout takes no inputs at all and
      # its v7 fork-PR block is scoped to `pull_request_target`/`workflow_run`, which this file
      # does not use; upload-artifact v7's `archive` is opt-in and defaults to the old
      # behaviour; the rest is ESM migration. Re-check `runs.using` when bumping again.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Browser binaries are ~150 MB and version-pinned; restoring them turns a
      # ~60 s download into a few seconds. A miss just downloads, so this is never
      # load-bearing for correctness.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ env.PW_VERSION }}

      # 5 MINUTES, AND IT IS THE POINT OF #496. Measured over one day this step ran 13 s, 13 s,
      # 15 s, 1m24s and 1m34s when healthy — and 17m46s, 24m55s and 25m07s when the registry or
      # `--with-deps` apt stalled. Those three took the whole JOB budget, so the gate either got
      # 7 minutes of a 13-minute run or never started, and the only thing the check said was
      # "the job exceeded the maximum execution time" — which reads as a slow test suite and is
      # what sent the first diagnosis chasing runner contention. 5 min is ~3x the worst healthy
      # figure and well under the stalls, so a stall now fails fast and NAMES ITSELF.
      - name: Vendor playwright into ./node_modules (no manifest in the repo)
        timeout-minutes: 5
        run: |
          # cd in a subshell, NOT `npm --prefix`: npm init honours --prefix
          # inconsistently across versions, and the version that ignores it writes
          # package.json into the repo root — the one outcome this must never have.
          mkdir -p "$RUNNER_TEMP/pw"
          ( cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && \
            npm install --no-audit --no-fund "playwright@$PW_VERSION" )
          cp -r "$RUNNER_TEMP/pw/node_modules" ./node_modules
          npx playwright install --with-deps chromium

      # node_modules/ is gitignored, so the checkout must still be clean here. If it
      # is not, the install leaked a manifest or a lockfile into the repo root and the
      # "no package.json" property this project holds has quietly been given up.
      - name: Assert the checkout is still manifest-free
        run: |
          test ! -f package.json || { echo "::error::a package.json appeared in the repo root"; exit 1; }
          test ! -f package-lock.json || { echo "::error::a package-lock.json appeared in the repo root"; exit 1; }
          git status --porcelain

      # HISTORY, not the current budget — the live numbers are on the step and the job below,
      # and this block described a 45-minute step under a 55-minute job that had ALREADY been
      # superseded twice when it was read as current (#637). Kept for its basis:
      # 45 MINUTES (was 20; re-budgeted 2026-08-21 when the backshop merge nearly doubled the
      # suite — 52 -> 86 runners, and the first push timed out at exactly 20:00). The old basis
      # was 7m42s-14m53s measured for ~52 runners with a ~2x runner-class spread; the merged
      # suite measures ~19 min locally at 10-way parallel, so the same 2x slow-end logic gives
      # ~38 — the step must always fail on its OWN name before the job's budget does.
      - name: Aggregate gate (shard ${{ matrix.shard }} of 3)
        # 40 -> 30 (#637 Phase E, 2026-09-05, same day): run_pwr2_engine is now THREE runners
        # (325 / 330 / 835 s solo, local) and the new tail is part C — group I, the failure
        # levers, 9 mutations x 85 s of replay. On CI the old whole file ran at 0.71x (green,
        # 1388 s) to 1.06x (red, 2094 s) of its local 1967 s, so part C lands at ~10-15 min on
        # this runner class; a shard is ~1610 s of hint across 3 lanes (~9 min) and carries that
        # runner in ONE lane, so the shard wall is the tail: ~15 min worst observed class. 30 is
        # 2x that, 35 on the job keeps the step failing on its own name. The 5189 s CI total is
        # unchanged by the split (1478 s vs 1551 s for the three parts — three process starts).
        # 55 -> 40 (#637, 2026-09-05, the sharding change): a shard is a third of the suite by
        # the `secs` hint (measured: 1611/1610/1610 s of hint across the three), so the honest
        # expectation is ~10 min. It is budgeted at 40 anyway because the UN-SPLIT tail runner
        # is still 23-35 min on its own and lands in exactly one shard. The integrator
        # re-budgets this from the measured per-shard wall once #637 Phase E splits it — the
        # step must always fail on its OWN name before the job's 45 does.
        # SUPERSEDED BY THE SHARDING ABOVE, hours later and under the same issue number. Kept
        # because its measurement is what motivated the split and its last paragraph is the
        # ruling against ever raising this number again:
        # 40 -> 55 (#637, 2026-09-05): the Alpha 1.7.2 release merge timed out HERE, on both
        # `develop` and `main`, at exactly 40:12 each — 34 of 106 runners done, no runner red.
        # The suite did not grow into the cap; ONE runner's variance ate it. `run_pwr2_engine`
        # is the wall (10-way parallel, so the step costs the slowest runner, not the sum) and
        # it measured 1388.0s on the green #630 run and 2094.6s on the red release run — a
        # 1.51x spread on the same commit-era suite, same runner image. Whole-step: 29.1 min
        # green against 40.2 truncated. 29.1 x 1.51 = 44, so 55 with margin, job wraps at 60.
        # DO NOT read the two reds as contention: the header note above already measured that
        # premise and refuted it — each workflow run gets its own hosted runner. They were
        # concurrent because a release merge always fires twice; they were slow because the
        # runner class was slow.
        # THE REAL FIX IS STILL CHEAPER MUTATION REPLAYS, not a bigger cap (#637) — one runner
        # at 23-35 minutes is the whole budget, and every raise buys the same 90 seconds of
        # margin nobody notices shrinking (#507 wave 8's words, twice over now).
        # 70 -> 40 (#513, 2026-08-25): measured 17m16s on the first green run after the
        # replay-scoping/split work; 2x the runner-class spread gives ~35 — see the job note
        # 45 -> 70 (#507 wave 8): timed out at 45 on the wave-7 push with every runner green
        # locally — see the job-level note
        timeout-minutes: 30
        run: node test/run_all.js --shard=${{ matrix.shard }}/3

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # THE SHARD NUMBER IS REQUIRED IN THE NAME. upload-artifact v4+ rejects a duplicate
          # artifact name across matrix jobs, and it fails the job AFTER the gate has already
          # run green — a red build with nothing wrong in it, on the second shard to finish.
          name: diagnostic-reports-${{ matrix.shard }}
          path: Diagnostic/
          if-no-files-found: ignore
          retention-days: 14

  # THE FAN-IN, AND ITS ID IS THE ONLY CHECK NAME `main`'s ruleset KNOWS (id 20067220,
  # required_status_checks, integration_id 15368 = GitHub Actions). The shards report as
  # `gate-shard (1..3)`; nothing there can ever satisfy a required context of `aggregate-gate`,
  # so without this job every release pull request would block for ever on a check that is
  # never reported. Give it no `name:` — a display name would replace the id as the context.
  aggregate-gate:
    runs-on: ubuntu-latest
    needs: gate-shard
    # always(), so a failed or cancelled shard still produces a REPORTED red rather than a
    # skipped check. A skipped required check blocks a pull request exactly as a missing one
    # does, which is the failure this job exists to prevent, arriving by the other door.
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every shard must have passed
        # `needs.<job>.result` on a matrix job is the AGGREGATE: 'success' only when all three
        # succeeded. Anything else — failure, cancelled, skipped — is a red here, named.
        run: |
          r="${{ needs.gate-shard.result }}"
          if [ "$r" != "success" ]; then
            echo "::error::gate-shard result is '$r', not 'success' — open the gate-shard (1..3) jobs; at least one shard failed, was cancelled, or never ran"
            exit 1
          fi
          echo "all 3 shards: $r"
