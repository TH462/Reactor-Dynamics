# The aggregate gate, run on every push and pull request.
#
# `node test/run_all.js --fast` runs 19 of the 21 runners and compares each against
# the BASELINES map at the top of that file. Drift is symmetric — a runner scoring
# BETTER than its baseline fails too, so a red turning green has to be acknowledged
# rather than silently absorbed.
#
# --fast skips the two Playwright gates (verify_e2e_ui, verify_manual_follow), which
# need a browser download. Everything else is plain Node with no dependencies at all —
# there is no package.json and nothing to install. Run those two locally before a
# release merge; see CLAUDE.md, "Definition of done".

name: gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  aggregate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Aggregate gate (21 runners, Playwright pair skipped)
        run: node test/run_all.js --fast

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-reports
          path: Diagnostic/
          if-no-files-found: ignore
          retention-days: 14
