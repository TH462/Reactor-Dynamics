# Reactor Dynamics — usage-data receiver.
#
# Deployed SEPARATELY from the site (the site is Cloudflare Pages; this is a Worker).
# Nothing in the repo build touches it, and the site does not know its address at
# build time — the URL is supplied to the Pages build as RD_TELEMETRY_ENDPOINT and
# stamped into site/telemetry_endpoint.js. With that variable unset, the site is
# silent and this Worker simply receives nothing.

name = "reactor-dynamics-telemetry"
main = "src/index.js"
compatibility_date = "2026-08-07"

# Session recordings from the in-sim bug report. A 30-minute session is ~63 KB
# gzipped and a 4-hour one ~504 KB (measured), so the free 10 GB holds tens of
# thousands of reports. SET A LIFECYCLE RULE ON THIS BUCKET — see the README. An
# analytics store with no expiry is a promise nobody made.
[[r2_buckets]]
binding = "BUNDLES"
bucket_name = "reactor-dynamics-bundles"

# Aggregate events. Retention is fixed at three months by Cloudflare and is not
# configurable, which is a feature here: the data ages out on its own.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "reactor_dynamics_usage"

# Feature-flag STAGES, set from the dashboard and read by the site BUILD.
#
# This is deliberately not read by the sim at runtime. site/flags.js resolves a stage
# from a build-stamped literal, and it must stay that way: test/run_portable.js asserts
# that nothing the shell ships loads anything at runtime, which is the only reason the
# single-file offline build works at all. A boot-time fetch of flag values would break
# that gate — it already caught the same pattern in telemetry.js, and the answer then
# was to ship neither file rather than add an exception.
#
# So the flow is dashboard -> KV -> `site/stamp_version.js` at BUILD -> a literal in the
# generated site/channel.js. A change therefore takes effect on the next deploy, not
# immediately, and the dashboard says so rather than implying otherwise.
[[kv_namespaces]]
binding = "FLAGS"
id = "7a421f75b14444e78a72a239c841c90d"

# OBSERVABILITY IS DELIBERATELY OFF. Do not turn it on to "see what the Worker is doing".
#
# Cloudflare's docs (workers/observability/logs/workers-logs, and the 2025-04-07 changelog):
# "All console.log() statements, exceptions, REQUEST METADATA, AND HEADERS are automatically
# captured during the Worker invocation." Headers includes CF-Connecting-IP, so invocation
# logs would store visitor IP addresses for 7 days — which contradicts src/index.js ("the IP
# ... is NEVER written anywhere") and the promise privacy.html makes on its behalf.
#
# `[observability.logs] invocation_logs = false` avoids that, and is pointless here: it leaves
# only console.log capture, and this Worker logs nothing on purpose.
#
# You do not need it anyway. Request counts, errors and timings come from the GraphQL
# `workersInvocationsAdaptive` dataset with no observability and no logging — that is how the
# 2026-08-09 "did the telemetry actually receive anything?" question was answered. What
# observability would add is the request contents, which is exactly the thing not to keep.
#
# If you ever DO need it, enable it for a bounded debugging window, and change privacy.html in
# the same commit — then turn it off and change the page back.

# The endpoint is public and unauthenticated by design — the alternative is a secret
# shipped inside a page whose source is published under the AGPL, which is not a
# secret. So the protections are a size cap (in the Worker) and this.
#
# 60 requests/minute per IP is far above any real session: the client batches events
# every 15 s and a bug report is a single POST. It is well below what makes an open
# endpoint worth abusing.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60
