<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWR Secondary Loop — Animated Diagram</title>
<style>
  :root{
    --bg:#070a0f; --panel:#0a0e15; --border:#243040;
    --pipe-case:#2a3744;
    --steam:#b4c0cc; --wet:#84a2b2; --cond:#5e92ac;
    --cw:#4e90ae;
    --text:#bcccd8; --dim:#62768a; --vdim:#3a4e60;
    --tap:#507893; --leader:#36485a; --water:#1e455c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);padding:12px;}
  .frame{max-width:1180px;margin:0 auto;}
  .titlebar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .title{font-size:13px;font-weight:600;color:#8ab0c2;letter-spacing:.02em;}
  .title span{color:var(--steam);}
  .subtitle{font-size:10px;color:var(--vdim);font-style:italic;}

  .diagram-wrap{background:radial-gradient(ellipse at 50% 45%, #0c1019 0%, #070a0f 82%);
    border:0.5px solid var(--border);border-radius:10px;padding:6px;}
  svg.loop{width:100%;height:auto;display:block;}

  .pipe-case{fill:none;stroke:var(--pipe-case);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;}
  .pipe-case.thin{stroke-width:7;}
  .flow{fill:none;stroke-width:4;stroke-linecap:butt;stroke-dasharray:5 11;
        animation:flow var(--flow-dur,1.1s) linear infinite;}
  .flow.steam-dash{stroke-dasharray:7 9;}
  @keyframes flow{ to{ stroke-dashoffset:-16; } }
  .loop.stopped .flow{ animation-play-state:paused; }
  .tube-flow{fill:none;stroke-width:3;stroke-linecap:butt;stroke-dasharray:4 8;
        animation:flow var(--flow-dur,1.1s) linear infinite;}
  .loop.stopped .tube-flow{ animation-play-state:paused; }

  .vessel{fill:#10171f;stroke:#3a5870;stroke-width:1.2;}
  .comp-label{fill:var(--dim);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
  .comp-sub{fill:var(--vdim);font-size:7.5px;letter-spacing:.04em;}

  .water{fill:var(--water);opacity:.6;}
  .surface{fill:none;stroke:#4e88a4;stroke-width:1.4;opacity:.9;}
  .steam-space{fill:#121a22;}

  .pump-body{fill:#10161f;stroke:#3a5870;stroke-width:1.2;}
  .pump-vane{stroke:#4a7088;stroke-width:1.4;stroke-linecap:round;}
  .turbine-blade{stroke:#4a7088;stroke-width:1.2;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .sec-arrow{fill:none;stroke:#46586a;stroke-width:1.4;}
  .sec-label{fill:var(--vdim);font-size:8px;letter-spacing:.04em;}

  .tap{fill:var(--tap);}
  .tap-tick{stroke:var(--tap);stroke-width:1.2;}
  .leader{stroke:var(--leader);stroke-width:.8;stroke-dasharray:2 2;fill:none;}
  .lbl-box{fill:#0e1620;stroke:#2c3e4e;stroke-width:.8;}
  .lbl-name{fill:var(--dim);font-size:8px;letter-spacing:.04em;text-transform:uppercase;}
  .lbl-val{fill:var(--text);font-size:13px;font-weight:600;}
  .lbl-unit{fill:var(--vdim);font-size:8px;}
  .lbl-note{fill:var(--vdim);font-size:7px;font-style:italic;}
  body.sensors-hidden .sensor{opacity:0;transition:opacity .25s;}
  .sensor{transition:opacity .25s;}

  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:10px;
            background:var(--panel);border:0.5px solid var(--border);border-radius:8px;padding:10px 14px;}
  .ctrl{display:flex;flex-direction:column;gap:3px;min-width:118px;}
  .ctrl label{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;}
  .ctrl label b{color:#8ab0c2;font-weight:600;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:#22303c;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#5a8aa6;border:0.5px solid #7aaac6;cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#5a8aa6;cursor:pointer;border:none;}
  .btn{font-size:9px;padding:5px 11px;border-radius:4px;border:0.5px solid #34485a;background:#101a24;color:#6a8a9a;cursor:pointer;letter-spacing:.04em;}
  .btn:hover{border-color:#4a6a7a;color:#8aaaba;}
  .btn.trip{border-color:#6a2c1e;background:#1a0a06;color:#c0664a;}
  .toggle{font-size:9px;padding:5px 11px;border-radius:4px;border:0.5px solid #34485a;background:#101a24;color:#6a8a9a;cursor:pointer;}
  .toggle.on{border-color:#2a6a54;background:#0a1a12;color:#5aaa84;}
  .legend{display:flex;gap:12px;margin-left:auto;align-items:center;flex-wrap:wrap;}
  .leg-item{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--dim);}
  .leg-dash{width:16px;height:3px;border-radius:2px;}
</style>
</head>
<body>
<div class="frame">

  <div class="titlebar">
    <div class="title">PWR Secondary Loop <span>♨</span> steam · turbine · condensate</div>
    <div class="subtitle">flow animation · phase color · live levels · sensors at read locations · physics illustrative</div>
  </div>

  <div class="diagram-wrap">
    <svg class="loop" id="loop" viewBox="0 40 1180 450" preserveAspectRatio="xMidYMid meet">

      <!-- ════════ PIPE CASINGS ════════ -->
      <!-- steam rail (high): SG top → turbine -->
      <path class="pipe-case" d="M210,150 V120 H700"/>
      <!-- turbine exhaust down into condenser -->
      <path class="pipe-case" d="M820,200 V250"/>
      <!-- condensate/feed rail: hotwell → down → cond pump → left → up → feed pump/FW htr → SG -->
      <path class="pipe-case" d="M820,422 V450 H560"/>
      <path class="pipe-case thin" d="M560,450 V330 H250"/>


      <!-- ════════ FLOW ════════ -->
      <path class="flow steam-dash" d="M210,150 V120 H700" stroke="var(--steam)"/>
      <path class="flow steam-dash" d="M820,200 V250" stroke="var(--wet)"/>
      <path class="flow" d="M820,422 V450 H560" stroke="var(--cond)"/>
      <path class="flow" d="M560,450 V330 H250" stroke="var(--cond)"/>

      <defs>
        <clipPath id="sgClip"><rect x="132" y="152" width="116" height="261" rx="14"/></clipPath>
        <clipPath id="condClip"><rect x="702" y="252" width="236" height="170" rx="10"/></clipPath>
        <clipPath id="turbClip"><path d="M700,108 L820,92 L820,200 L700,184 Z"/></clipPath>
        <linearGradient id="gradCondTube" x1="0" y1="298" x2="0" y2="382" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#84a2b2"/>
          <stop offset="0.6" stop-color="#6a8a9a"/>
          <stop offset="1" stop-color="#5e92ac"/>
        </linearGradient>
      </defs>

      <!-- ════════ STEAM GENERATOR (secondary side, vertical-tube exchanger) ════════ -->
      <rect class="vessel" x="130" y="150" width="120" height="265" rx="16"/>
      <g clip-path="url(#sgClip)">
        <rect class="steam-space" x="132" y="152" width="116" height="261"/>
        <rect class="water" id="sgWater" x="132" y="250" width="116" height="163"/>
        <path class="surface" id="sgSurface" d="M132,250 H248"/>
        <!-- primary tubes (greyed — detail lives in primary diagram) -->
        <line x1="160" y1="285" x2="160" y2="400" stroke="#2a3744" stroke-width="2" stroke-dasharray="3 6"/>
        <line x1="176" y1="285" x2="176" y2="400" stroke="#2a3744" stroke-width="2" stroke-dasharray="3 6"/>
        <line x1="192" y1="285" x2="192" y2="400" stroke="#2a3744" stroke-width="2" stroke-dasharray="3 6"/>
        <line x1="208" y1="285" x2="208" y2="400" stroke="#2a3744" stroke-width="2" stroke-dasharray="3 6"/>
        <line x1="224" y1="285" x2="224" y2="400" stroke="#2a3744" stroke-width="2" stroke-dasharray="3 6"/>
      </g>
      <text class="comp-label" x="190" y="200" text-anchor="middle">Steam Gen</text>
      <text class="comp-sub" x="190" y="211" text-anchor="middle">secondary side</text>
      <!-- primary connection marker -->
      <path class="pipe-case thin" d="M130,350 H100" stroke="#2a3744"/>
      <text class="sec-label" x="94" y="353" text-anchor="end" style="fill:#52687c;">↤ primary</text>

      <!-- ════════ TURBINE ════════ -->
      <path class="vessel" d="M700,108 L820,92 L820,200 L700,184 Z"/>
      <!-- turbine rotor: blades on a horizontal shaft (sweep horizontally, not pinwheel) -->
      <line x1="700" y1="146" x2="820" y2="146" stroke="#3a5870" stroke-width="1.4"/>
      <g clip-path="url(#turbClip)"><g id="turbineRotor"></g></g>
      <text class="comp-label" x="760" y="86" text-anchor="middle">Turbine</text>
      <!-- generator -->
      <circle class="vessel" cx="868" cy="146" r="22"/>
      <text class="comp-sub" x="868" y="150" text-anchor="middle" style="fill:#52687c;">GEN</text>
      <line class="pipe-case thin" x1="820" y1="146" x2="846" y2="146"/>
      <path class="sec-arrow" d="M890,146 H924"/>
      <polygon points="918,142 918,150 926,146" fill="#46586a"/>
      <text class="sec-label" x="930" y="149" text-anchor="start">grid</text>

      <!-- ════════ CONDENSER (vertical-tube heat exchanger, mirrors SG) ════════ -->
      <rect class="vessel" x="700" y="250" width="240" height="172" rx="12"/>
      <g clip-path="url(#condClip)">
        <rect class="steam-space" x="702" y="252" width="236" height="170"/>
        <rect class="water" id="condWater" x="702" y="386" width="236" height="36"/>
        <path class="surface" id="condSurface" d="M702,386 H938"/>
        <!-- cooling-water tubes (vertical, steam condenses on them) -->
        <g id="condTubes"></g>
      </g>
      <text class="comp-label" x="820" y="272" text-anchor="middle">Condenser</text>
      <text class="comp-sub" x="820" y="283" text-anchor="middle">heat exchanger</text>
      <!-- circulating water in/out (bottom) -->
      <path class="sec-arrow" d="M700,408 H668"/>
      <polygon points="674,404 674,412 666,408" fill="#46586a"/>
      <text class="sec-label" x="662" y="411" text-anchor="end">CW out</text>
      <path class="sec-arrow" d="M972,408 H940"/>
      <polygon points="946,404 946,412 938,408" fill="#46586a"/>
      <text class="sec-label" x="978" y="411" text-anchor="start">CW in</text>

      <!-- ════════ PUMPS (on the condensate rail) ════════ -->
      <!-- condensate pump (on condensate run, near hotwell) -->
      <circle class="pump-body" cx="700" cy="450" r="16"/>
      <g id="condPump">
        <line class="pump-vane" x1="700" y1="450" x2="700" y2="437"/>
        <line class="pump-vane" x1="700" y1="450" x2="711" y2="457"/>
        <line class="pump-vane" x1="700" y1="450" x2="689" y2="457"/>
      </g>
      <circle cx="700" cy="450" r="2.6" fill="#3a5870"/>
      <text class="comp-sub" x="700" y="476" text-anchor="middle" style="fill:#52687c;">Cond Pump</text>

      <!-- feedwater heater (on feed rail) -->
      <rect class="vessel" x="392" y="318" width="40" height="24" rx="6"/>
      <text class="comp-sub" x="412" y="334" text-anchor="middle" style="fill:#52687c;">FW Htr</text>

      <!-- main feed pump (between FW htr and SG) -->
      <circle class="pump-body" cx="320" cy="330" r="15"/>
      <g id="feedPump">
        <line class="pump-vane" x1="320" y1="330" x2="320" y2="318"/>
        <line class="pump-vane" x1="320" y1="330" x2="331" y2="337"/>
        <line class="pump-vane" x1="320" y1="330" x2="309" y2="337"/>
      </g>
      <circle cx="320" cy="330" r="2.6" fill="#3a5870"/>
      <text class="comp-sub" x="320" y="358" text-anchor="middle" style="fill:#52687c;">Feed Pump</text>

      <!-- ════════ SENSORS ════════ -->
      <g class="sensors">

        <!-- Steam Flow (steam rail) -->
        <g class="sensor">
          <line class="tap-tick" x1="430" y1="114" x2="430" y2="126"/>
          <circle class="tap" cx="430" cy="120" r="2.4"/>
          <path class="leader" d="M430,120 V80"/>
          <rect class="lbl-box" x="386" y="50" width="88" height="30" rx="4"/>
          <text class="lbl-name" x="393" y="61">Steam Flow</text>
          <text class="lbl-val" x="393" y="75"><tspan id="vSteam">100</tspan><tspan class="lbl-unit"> %</tspan></text>
        </g>

        <!-- Steam Pressure (SG steam space) -->
        <g class="sensor">
          <line class="tap-tick" x1="244" y1="190" x2="256" y2="190"/>
          <circle class="tap" cx="250" cy="190" r="2.4"/>
          <path class="leader" d="M250,190 H294"/>
          <rect class="lbl-box" x="294" y="175" width="92" height="30" rx="4"/>
          <text class="lbl-name" x="301" y="186">Steam Press</text>
          <text class="lbl-val" x="301" y="200"><tspan id="vSteamP">850</tspan><tspan class="lbl-unit"> psi</tspan></text>
        </g>

        <!-- SG Level -->
        <g class="sensor">
          <line class="tap-tick" x1="244" y1="290" x2="256" y2="290"/>
          <circle class="tap" cx="250" cy="290" r="2.4"/>
          <path class="leader" d="M250,290 H300"/>
          <rect class="lbl-box" x="300" y="276" width="78" height="30" rx="4"/>
          <text class="lbl-name" x="307" y="287">SG Level</text>
          <text class="lbl-val" x="307" y="301"><tspan id="vSg">65</tspan><tspan class="lbl-unit"> %</tspan></text>
        </g>

        <!-- Turbine RPM -->
        <g class="sensor">
          <circle class="tap" cx="760" cy="146" r="2.4"/>
          <path class="leader" d="M760,146 V80 H810"/>
          <rect class="lbl-box" x="802" y="50" width="86" height="30" rx="4"/>
          <text class="lbl-name" x="809" y="61">Turbine RPM</text>
          <text class="lbl-val" x="809" y="75"><tspan id="vRpm">1800</tspan></text>
        </g>

        <!-- Output -->
        <g class="sensor">
          <circle class="tap" cx="868" cy="168" r="2.4"/>
          <path class="leader" d="M868,168 V202 H928"/>
          <rect class="lbl-box" x="920" y="188" width="84" height="30" rx="4"/>
          <text class="lbl-name" x="927" y="199">Output</text>
          <text class="lbl-val" x="927" y="213"><tspan id="vMw">1000</tspan><tspan class="lbl-unit"> MW</tspan></text>
        </g>

        <!-- Condenser Vacuum -->
        <g class="sensor">
          <line class="tap-tick" x1="820" y1="256" x2="820" y2="268"/>
          <circle class="tap" cx="820" cy="262" r="2.4"/>
          <path class="leader" d="M820,262 V232 H952"/>
          <rect class="lbl-box" x="944" y="240" width="98" height="30" rx="4"/>
          <text class="lbl-name" x="951" y="251">Cond. Vacuum</text>
          <text class="lbl-val" x="951" y="265"><tspan id="vVac">28.5</tspan><tspan class="lbl-unit"> inHg</tspan></text>
        </g>

        <!-- Hotwell Temp -->
        <g class="sensor">
          <line class="tap-tick" x1="820" y1="404" x2="820" y2="416"/>
          <circle class="tap" cx="820" cy="404" r="2.4"/>
          <path class="leader" d="M820,404 V440 H952"/>
          <rect class="lbl-box" x="944" y="440" width="96" height="30" rx="4"/>
          <text class="lbl-name" x="951" y="451">Hotwell Temp</text>
          <text class="lbl-val" x="951" y="465"><tspan id="vHot">102</tspan><tspan class="lbl-unit"> °F</tspan></text>
        </g>

        <!-- Feedwater Flow (feed rail) -->
        <g class="sensor">
          <line class="tap-tick" x1="480" y1="324" x2="480" y2="336"/>
          <circle class="tap" cx="480" cy="330" r="2.4"/>
          <path class="leader" d="M480,330 V300 H440"/>
          <rect class="lbl-box" x="394" y="276" width="98" height="30" rx="4"/>
          <text class="lbl-name" x="401" y="287">Feedwater Flow</text>
          <text class="lbl-val" x="401" y="301"><tspan id="vFeed">100</tspan><tspan class="lbl-unit"> %</tspan></text>
        </g>

      </g>

    </svg>
  </div>

  <div class="controls">
    <div class="ctrl">
      <label>Turbine Load <b id="lblLoad">100%</b></label>
      <input type="range" id="load" min="0" max="100" value="100">
    </div>
    <div class="ctrl">
      <label>Feedwater <b id="lblFeed">100%</b></label>
      <input type="range" id="feed" min="0" max="100" value="100">
    </div>
    <div class="ctrl">
      <label>Condenser Vacuum <b id="lblVac">good</b></label>
      <input type="range" id="vac" min="20" max="100" value="100">
    </div>
    <button class="btn trip" id="trip">Turbine Trip</button>
    <button class="btn" id="reset">Reset</button>
    <button class="toggle on" id="sensorsToggle">Sensors</button>

    <div class="legend">
      <div class="leg-item"><div class="leg-dash" style="background:var(--steam)"></div>dry steam</div>
      <div class="leg-item"><div class="leg-dash" style="background:var(--wet)"></div>wet steam</div>
      <div class="leg-item"><div class="leg-dash" style="background:var(--cond)"></div>condensate</div>
    </div>
  </div>

</div>

<script>
(function(){
  const loop=document.getElementById('loop');
  const $=id=>document.getElementById(id);

  // condenser cooling-water tubes (vertical) — steam condenses across them
  (function buildCondTubes(){
    const ns='http://www.w3.org/2000/svg';
    const g=$('condTubes');
    for(let x=724;x<=916;x+=24){
      const t=document.createElementNS(ns,'path');
      t.setAttribute('class','tube-flow');
      t.setAttribute('d',`M${x},298 V382`);
      t.setAttribute('stroke','url(#gradCondTube)');
      t.setAttribute('stroke-dasharray','3 7');
      g.appendChild(t);
    }
  })();

  // turbine rotor blades — spin around the horizontal shaft (sweep across, no pinwheel)
  (function buildBlades(){
    const ns='http://www.w3.org/2000/svg';
    const g=$('turbineRotor');
    // two interleaved sets so the horizontal scroll loops seamlessly
    for(let x=684;x<=840;x+=15){
      const ln=document.createElementNS(ns,'line');
      ln.setAttribute('class','turbine-blade');
      const t=Math.max(0,Math.min(1,(x-700)/120));
      const half=18+t*22;                  // blades taller toward exhaust end
      ln.setAttribute('x1',x); ln.setAttribute('y1',(146-half).toFixed(0));
      ln.setAttribute('x2',x); ln.setAttribute('y2',(146+half).toFixed(0));
      g.appendChild(ln);
    }
  })();

  let load=1, feed=1, vac=1, tripped=false, phase=0;
  const loadEl=$('load'),feedEl=$('feed'),vacEl=$('vac');
  loadEl.addEventListener('input',()=>{tripped=false;load=loadEl.value/100;});
  feedEl.addEventListener('input',()=>feed=feedEl.value/100);
  vacEl.addEventListener('input',()=>vac=vacEl.value/100);
  $('trip').addEventListener('click',()=>tripped=true);
  $('reset').addEventListener('click',()=>{
    tripped=false;load=1;feed=1;vac=1;
    loadEl.value=100;feedEl.value=100;vacEl.value=100;
  });
  $('sensorsToggle').addEventListener('click',e=>{
    document.body.classList.toggle('sensors-hidden',!e.target.classList.toggle('on'));
  });

  const st=document.createElement('style');
  st.textContent=`@keyframes bladeSweep{ to{ transform:translateX(-15px); } }
    #turbineRotor{animation:bladeSweep var(--blade-dur,.5s) linear infinite;}
    #condPump{transform-origin:700px 450px;animation:spin var(--spin-dur,1s) linear infinite;}
    #feedPump{transform-origin:320px 330px;animation:spin var(--spin-dur,1s) linear infinite;}
    .loop.stopped #turbineRotor,.loop.stopped #condPump,.loop.stopped #feedPump{animation-play-state:paused;}`;
  document.head.appendChild(st);

  let last=performance.now();
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000);last=now;phase+=dt;
    if(tripped&&load>0.02){load*=Math.pow(0.4,dt);if(load<0.02)load=0;loadEl.value=Math.round(load*100);}

    const sFlow=Math.max(load,0.02);
    if(sFlow<0.04){loop.classList.add('stopped');}
    else{loop.classList.remove('stopped');
      loop.style.setProperty('--flow-dur',Math.max(0.35,Math.min(7,1.05/sFlow)).toFixed(3)+'s');
      loop.style.setProperty('--spin-dur',Math.max(0.2,Math.min(4,0.6/load)).toFixed(3)+'s');
      loop.style.setProperty('--blade-dur',Math.max(0.12,Math.min(2,0.32/load)).toFixed(3)+'s');}

    const rpm=load<0.04?0:Math.round(1800*(0.6+load*0.4));
    const mw=Math.round(1000*load);
    const vacInHg=20+vac*8.8;
    const hotT=80+(1-vac)*60;
    const steamP=700+load*180;
    $('vSteam').textContent=Math.round(load*100);
    $('vSteamP').textContent=Math.round(steamP);
    $('vSg').textContent=65;
    $('vRpm').textContent=rpm;
    $('vMw').textContent=mw;
    $('vVac').textContent=vacInHg.toFixed(1);
    $('vHot').textContent=Math.round(hotT);
    $('vFeed').textContent=Math.round(feed*100);

    $('lblLoad').textContent=Math.round(load*100)+'%';
    $('lblFeed').textContent=Math.round(feed*100)+'%';
    $('lblVac').textContent=vac>0.8?'good':vac>0.5?'degraded':'poor';

    let sg=0.65+(feed-load)*0.06; sg=Math.max(0.25,Math.min(0.9,sg));
    const sT=152,sB=413,sH=sB-sT, sy=sB-sg*sH, sbob=Math.sin(phase*3)*1.1;
    $('sgWater').setAttribute('y',(sy+sbob).toFixed(1));
    $('sgWater').setAttribute('height',(sB-(sy+sbob)).toFixed(1));
    $('sgSurface').setAttribute('d',`M132,${(sy+sbob).toFixed(1)} q29,-2 58,0 t58,0`);

    const cbob=Math.sin(phase*2.6)*0.8;
    $('condSurface').setAttribute('d',`M702,${(386+cbob).toFixed(1)} q59,-1.6 118,0 t118,0`);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
